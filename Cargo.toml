[workspace]
resolver = "2"
members = [
    "crates/paneflow-agent-config",
    "crates/paneflow-ai-hook",
    "crates/paneflow-browser-protocol",
    "crates/paneflow-browser-host",
    "crates/paneflow-config",
    "crates/paneflow-ipc-client",
    "crates/paneflow-ghostty-smoke",
    "crates/paneflow-libghostty-sys",
    "crates/paneflow-mcp",
    "crates/paneflow-mcp-install",
    "crates/paneflow-process",
    "crates/paneflow-shim",
    "crates/paneflow-telemetry",
    "crates/paneflow-terminal-ghostty",
    "crates/paneflow-textdiff",
    "src-app",
]
# Scope bare `cargo run` / `cargo build` / `cargo test` to the desktop app.
# The AI-hook callback and shim binaries are helpers built on demand (via
# `-p` or the release-min profile); including them here would make `cargo
# run` ambiguous across three binaries.
default-members = ["src-app"]
# The patched GPUI checkout below is its own Cargo workspace; keep it out of
# ours so Cargo resolves its crates through native/gpui/checkout/Cargo.toml.
exclude = ["native/gpui/checkout", "native/accesskit-atspi-common"]

[workspace.package]
version = "0.12.0"
edition = "2021"
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
authors = ["Arthur"]
description = "Native Rust terminal workspace for running coding agents in parallel"
repository = "https://github.com/arthjean/paneflow"
homepage = "https://paneflow.dev"
keywords = ["terminal", "coding-agents", "ai-agents", "gpui", "rust"]
categories = ["command-line-utilities"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Shared runtime utilities
ctrlc = "3.4"
dirs = "6"
interprocess = "2.4"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
notify = "7"
tempfile = "3"
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
which = "8"
widestring = "1"

# Internal crates
paneflow-agent-config = { path = "crates/paneflow-agent-config" }
paneflow-config = { path = "crates/paneflow-config" }
paneflow-ipc-client = { path = "crates/paneflow-ipc-client" }
paneflow-process = { path = "crates/paneflow-process" }
paneflow-telemetry = { path = "crates/paneflow-telemetry" }
paneflow-textdiff = { path = "crates/paneflow-textdiff" }

# Workspace-wide clippy lint policy (US-007). Mirrors the mandatory
# CLAUDE.md cherry-picked restriction set. `warn` is preferred over `deny`
# for the unwrap/expect family per documented community practice and the
# `allow-unwrap-in-tests` / `allow-expect-in-tests` escape hatches in
# `clippy.toml`. Each member crate declares `[lints] workspace = true`
# (or overrides specific lints locally where justified).
[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
missing_safety_doc = "allow"

# Required by GPUI - these forks must stay in sync with the pinned Zed rev
# in src-app/Cargo.toml. When bumping GPUI rev, verify these still resolve.
[patch.crates-io]
accesskit_atspi_common = { path = "native/accesskit-atspi-common" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }

# GPUI external-surface extension (docs/browser/gpui-external-surfaces.md).
# scripts/fetch-gpui.py places the upstream tree pinned by
# native/gpui/manifest.toml under native/gpui/checkout and applies the
# reviewed patch series from native/gpui/patches. Every Zed crate that the
# pinned `rev` values in src-app/Cargo.toml pull is redirected here so one
# source serves the whole GPUI closure; the `rev` values remain the upstream
# pin and must match native/gpui/manifest.toml.
[patch."https://github.com/zed-industries/zed"]
collections = { path = "native/gpui/checkout/crates/collections" }
derive_refineable = { path = "native/gpui/checkout/crates/refineable/derive_refineable" }
gpui = { path = "native/gpui/checkout/crates/gpui" }
gpui_apple = { path = "native/gpui/checkout/crates/gpui_apple" }
gpui_linux = { path = "native/gpui/checkout/crates/gpui_linux" }
gpui_macos = { path = "native/gpui/checkout/crates/gpui_macos" }
gpui_macros = { path = "native/gpui/checkout/crates/gpui_macros" }
gpui_platform = { path = "native/gpui/checkout/crates/gpui_platform" }
gpui_shared_string = { path = "native/gpui/checkout/crates/gpui_shared_string" }
gpui_util = { path = "native/gpui/checkout/crates/gpui_util" }
gpui_web = { path = "native/gpui/checkout/crates/gpui_web" }
gpui_wgpu = { path = "native/gpui/checkout/crates/gpui_wgpu" }
gpui_windows = { path = "native/gpui/checkout/crates/gpui_windows" }
http_client = { path = "native/gpui/checkout/crates/http_client" }
media = { path = "native/gpui/checkout/crates/media" }
perf = { path = "native/gpui/checkout/tooling/perf" }
refineable = { path = "native/gpui/checkout/crates/refineable" }
scheduler = { path = "native/gpui/checkout/crates/scheduler" }
sum_tree = { path = "native/gpui/checkout/crates/sum_tree" }
util_macros = { path = "native/gpui/checkout/crates/util_macros" }
zlog = { path = "native/gpui/checkout/crates/zlog" }
ztracing = { path = "native/gpui/checkout/crates/ztracing" }
ztracing_macro = { path = "native/gpui/checkout/crates/ztracing_macro" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Size-optimized profile for the embedded AI-hook callback and shim binaries
# (US-001 / US-004 / US-008). The hook callback runs ~6 times per AI turn, so
# it's a hot path; smaller binaries also reduce the rust-embed footprint per
# PaneFlow build. `panic = "abort"` and `lto = "fat"` are not available via
# per-package profile overrides, hence the dedicated profile.
#
# Build: `cargo build -p paneflow-ai-hook --profile release-min`
[profile.release-min]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package]
name = "paneflow-libghostty-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["native"]
native = ["paneflow-terminal-ghostty/native"]

[dependencies]
libfuzzer-sys = "=0.4.12"
paneflow-program-resume = { path = "../crates/paneflow-program-resume" }
paneflow-terminal-ghostty = { path = "../crates/paneflow-terminal-ghostty" }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot"
path = "fuzz_targets/snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program_resume"
path = "fuzz_targets/program_resume.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

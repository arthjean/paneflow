[package]
name = "paneflow-host"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "GPU-free local host that owns Paneflow terminal sessions, their child processes and canonical libghostty state"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "paneflow-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
interprocess.workspace = true
log.workspace = true
paneflow-config.workspace = true
paneflow-home.workspace = true
paneflow-ipc-client.workspace = true
paneflow-terminal-ghostty = { path = "../paneflow-terminal-ghostty", features = ["native"] }
portable-pty = "0.9.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

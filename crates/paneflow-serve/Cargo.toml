[package]
name = "paneflow-serve"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Per-home Paneflow worker: owns the activity reducer and serves Controllers over the advertised-capability protocol"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
interprocess.workspace = true
log.workspace = true
paneflow-agent-config.workspace = true
paneflow-config.workspace = true
paneflow-home.workspace = true
paneflow-host.workspace = true
paneflow-ipc-client.workspace = true
paneflow-mcp-install.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[lints]
workspace = true

[package]
name = "terminal-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = []
hera-dogfood = [
    "dep:vte",
    "terminal-protocol/hera-dogfood",
    "terminal-render-model/hera-dogfood",
]

[dependencies]
terminal-protocol = { path = "../terminal-protocol", default-features = false }
terminal-render-model = { path = "../terminal-render-model", default-features = false }
vte = { version = "0.15.0", default-features = false, optional = true }

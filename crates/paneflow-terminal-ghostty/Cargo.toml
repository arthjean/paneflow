[package]
name = "paneflow-terminal-ghostty"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
build = "build.rs"
publish = false

[features]
default = []
native = ["dep:paneflow-libghostty-sys", "paneflow-libghostty-sys/link"]

[dependencies]
regex = "1"
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64"), all(target_os = "windows", target_arch = "x86_64", target_env = "msvc")))'.dependencies]
paneflow-libghostty-sys = { path = "../paneflow-libghostty-sys", optional = true }

[lints]
workspace = true

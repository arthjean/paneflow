[package]
name = "paneflow-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Read-only in-process git status for the Paneflow background probes, built on gix"

[features]
oracle = ["dep:tempfile"]

[dependencies]
gix = { version = "=0.90.0", default-features = false, features = ["status", "parallel", "sha1", "sha256"] }
gix-notify = { path = "../../vendor/gix-notify" }
log.workspace = true
paneflow-home.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[lints]
workspace = true

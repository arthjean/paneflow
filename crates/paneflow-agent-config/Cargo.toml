[package]
name = "paneflow-agent-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dependency-light shared primitives for safely editing coding-agent configuration."

[features]
default = ["config-io"]
config-io = ["dep:dirs", "dep:paneflow-home"]

[dependencies]
dirs = { workspace = true, optional = true }
paneflow-home = { workspace = true, optional = true }
serde_json.workspace = true

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
toml = "0.8"

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true
toml = "0.8"

[lints]
workspace = true

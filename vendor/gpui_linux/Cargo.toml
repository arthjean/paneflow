# gpui_linux from zed-industries/zed 703b5ac3f4ffe1e87a073123ae56e22f72f095c4
# (crates/gpui_linux), applied through the root
# `[patch."https://github.com/zed-industries/zed"]`. The Zed workspace
# inheritance is written out with the values that revision's workspace
# manifest gives, its `[lints]` table is dropped because the Zed lint set does
# not exist here, except Zed's `unexpected_cfgs = allow`: the sources test a
# `nightly_coverage` feature that is declared nowhere, and the CI's
# `RUSTFLAGS=-D warnings` is not capped for a path dependency. The
# dev-dependencies are left out. Bump this copy together with the Zed revision
# in src-app/Cargo.toml.
#
# The changes to the upstream sources are:
# - src/linux/wayland/client.rs: the wl_keyboard Modifiers and Key handlers
#   ignore the event while no XKB keymap has been received, instead of
#   unwrapping the missing keymap state. A seat may have a keyboard without a
#   keymap (sway sends Enter and Modifiers with no Keymap event once its last
#   keyboard is gone), which made the app panic as its window opened.
# - src/linux/x11/window.rs: `normal_size_hints` writes the minimum size to
#   WM_NORMAL_HINTS in device pixels plus the client inset, and
#   `set_client_inset` refreshes it whenever _GTK_FRAME_EXTENTS changes. The
#   minimum was written in logical pixels and without the transparent inset,
#   so a client-decorated window could shrink below its minimum visible size,
#   by the inset at scale 1 and by half its size at scale 2.
# - src/linux/wayland/client.rs: the wl_seat Capabilities handler releases
#   the wl_keyboard or wl_pointer whose capability went away, leaving its
#   window the way a Leave would, and creates one only when the seat gains it.
#   Upstream kept a removed device (stale hover and focus) and re-created the
#   keyboard and text input on every capability change, dropping the IME
#   state.
# Drop this copy once the pinned Zed revision carries these changes.

[package]
name = "gpui_linux"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lib]
path = "src/gpui_linux.rs"
doctest = false

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
wayland = [
    "dep:accesskit_unix",
    "gpui_wgpu",
    "ashpd/wayland",

    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon/wayland",
    "open",
    "gpui/wayland",
    "uuid/v5",
]
x11 = [
    "dep:accesskit_unix",
    "gpui_wgpu",
    "ashpd",

    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon/x11",
    "xim",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = [
    "gpui/screen-capture",
    "scap",
]


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_unix = { version = "0.22", optional = true }
anyhow = "1.0.86"
bytemuck = "1"
collections = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4", version = "0.1.0" }
futures = "0.3.34"
gpui = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4", default-features = false }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4", optional = true, features = ["font-kit"] }
http_client = { git = "https://github.com/zed-industries/zed", rev = "703b5ac3f4ffe1e87a073123ae56e22f72f095c4" }
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
strum = { version = "0.28", features = ["derive"] }
url = "2.2"
uuid = { version = "1.1", features = ["serde"] }

# Always used
oo7 = { git = "https://github.com/zed-industries/oo7", rev = "731c1215edb6905876c6137ab300428c7b8d7c13", version = "0.6", default-features = false, features = [
    "async-std",
    "native_crypto",
] }
calloop = "0.14.3"
notify-rust = "4"
raw-window-handle = "0.6"

# Used in both windowing options
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "inhibit",
    "open_uri",
    "file_chooser",
    "settings"
], optional = true }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }
xkbcommon = { version = "0.8", default-features = false, optional = true }

# Screen capture
scap = { git = "https://github.com/zed-industries/scap", rev = "b5c86ec58dd4b6b7732bf6ac8be03d6b1f190a82", default-features = false, package = "zed-scap", version = "0.0.8-zed", optional = true }

# Wayland
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.15", features = [
    "client_system",
    "dlopen",
    "log",
], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = [
    "client",
    "staging",
    "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = [
    "client",
], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = [
    "client",
], optional = true }

# X11
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
    "dri3",
], optional = true }
# WARNING: If you change this, you must also publish a new version of zed-xim to crates.io
xim = { git = "https://github.com/zed-industries/xim-rs.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8", features = [
    "x11rb-xcb",
    "x11rb-client",
], package = "zed-xim", version = "0.4.0-zed", optional = true }

[package.metadata.cargo-shear]
ignored = ["scap"]

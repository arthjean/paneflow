# gix-dir 0.32.0 from crates.io (GitoxideLabs/gitoxide dd39fb66e3b1551c9fe849043e39b357a9799ca1,
# path gix-dir/), applied through the root `[patch.crates-io]`. The only change to the
# published sources adds src/walk/listing.rs and `walk_with_listing()`: a `Listing` reads a
# set of directories once, on a rayon pool that every listing of the process shares, and the
# walk takes the entries of every directory it holds from it instead of reading the directory
# again. On Windows the enumeration carries every entry's metadata; on unix the listing reads
# each requested name with `fstatat` relative to the directory it opened (rustix), and
# `ListedEntry` exposes a gix `entry::Kind` and a `gix_index::fs::Metadata` on both. `walk()`
# is unchanged. The vendored gix-status builds the listing on every platform, so a status
# reads each tracked directory once (https://github.com/arthjean/paneflow/issues/134). The
# published dev-dependencies are left out. Drop this copy once a gix-dir release offers the
# same hook.

[package]
edition = "2024"
rust-version = "1.88"
name = "gix-dir"
version = "0.32.0"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
build = false
include = [
    "/src/**/*",
    "/LICENSE-*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A crate of the gitoxide project dealing with directory walks"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
resolver = "2"

[package.metadata.docs.rs]
features = ["sha1"]

[features]
sha1 = [
    "gix-index/sha1",
    "gix-worktree/sha1",
]
sha256 = [
    "gix-index/sha256",
    "gix-worktree/sha256",
]

[lib]
name = "gix_dir"
path = "src/lib.rs"
test = false
doctest = false

[dependencies.bstr]
version = "1.12.0"
default-features = false

[dependencies.gix-discover]
version = "^0.57.1"

[dependencies.gix-error]
version = "^0.5.2"

[dependencies.gix-fs]
version = "^0.24.1"

[dependencies.gix-ignore]
version = "^0.24.0"

[dependencies.gix-index]
version = "^0.58.0"

[dependencies.gix-object]
version = "^0.66.1"

[dependencies.gix-path]
version = "^0.14.1"

[dependencies.gix-pathspec]
version = "^0.22.1"

[dependencies.gix-trace]
version = "^0.3.1"

[dependencies.gix-utils]
version = "^0.5.1"
features = ["bstr"]

[dependencies.gix-worktree]
version = "^0.59.0"
default-features = false

[dependencies.rayon]
version = "1.12.0"

[target."cfg(unix)".dependencies.rustix]
version = "1.1.2"
features = [
    "std",
    "fs",
]
default-features = false

[lints.clippy]
assert_is_empty = "allow"
bool_to_int_with_if = "allow"
borrow_as_ptr = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
checked_conversions = "allow"
copy_iterator = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
empty_docs = "allow"
enum_glob_use = "allow"
explicit_deref_methods = "allow"
explicit_into_iter_loop = "allow"
explicit_iter_loop = "allow"
filter_map_next = "allow"
fn_params_excessive_bools = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
inconsistent_struct_constructor = "allow"
inefficient_to_string = "allow"
inline_always = "allow"
items_after_statements = "allow"
iter_not_returning_iterator = "allow"
iter_without_into_iter = "allow"
large_enum_variant = "allow"
large_stack_arrays = "allow"
manual_assert = "allow"
manual_is_variant_and = "allow"
manual_let_else = "allow"
manual_string_new = "allow"
many_single_char_names = "allow"
match_bool = "allow"
match_same_arms = "allow"
match_wild_err_arm = "allow"
match_wildcard_for_single_variants = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
mut_mut = "allow"
naive_bytecount = "allow"
needless_continue = "allow"
needless_for_each = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
no_effect_underscore_binding = "allow"
option_option = "allow"
range_plus_one = "allow"
redundant_else = "allow"
result_large_err = "allow"
return_self_not_must_use = "allow"
should_panic_without_expect = "allow"
similar_names = "allow"
single_match_else = "allow"
stable_sort_primitive = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
transmute_ptr_to_ptr = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_join = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]

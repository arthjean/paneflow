# gix-notify 0.1.0, unpublished, copied from GitoxideLabs/gitoxide
# 1077036b45761f31a34da1e930f3163b7c502cb6 (path gix-notify/, the head of the draft
# https://github.com/GitoxideLabs/gitoxide/pull/3153 on 2026-11-07) and linked by
# crates/paneflow-git as a path dependency. The sources under src/, tests/ and
# examples/ and both licenses are the upstream text. Paneflow changes only this
# manifest: the `path = "../gix-*"` sibling dependencies become the crates.io
# requirements `gix-error` ^0.5.1 and `gix-parallel` ^0.50.0 that gix 0.90 already
# resolves, `lints.workspace = true` is dropped because it would inherit
# Paneflow's lint policy, and the `notify` 8 dependency for targets other than
# Linux, macOS and Windows is removed, so the `compat` backend does not build
# there and Paneflow ships on none of them. Any Paneflow change to the sources
# must carry a test and be listed here. Drop this copy at the first gix-notify
# release on crates.io that gix-error and gix-parallel versions compatible with
# the pinned gix can resolve (https://github.com/arthjean/paneflow/issues/134).

[package]
name = "gix-notify"
version = "0.1.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "Bounded filesystem notifications for long-running applications"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/examples/**/*", "/LICENSE-*"]
autotests = false
autoexamples = false
autobenches = false

[dependencies]
gix-error = "^0.5.1"
gix-parallel = { version = "^0.50.0", features = ["parallel"] }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.5", default-features = false }
rustix = { version = "1.1.5", features = ["event"] }
tempfile = "3.26.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4.1.0"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std"] }
libc = "0.2.186"
tempfile = "3.26.0"

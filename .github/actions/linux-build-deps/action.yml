name: Linux build dependencies
description: >-
  Install the GPUI / Blade / fontconfig system libraries every Linux cargo job
  in this repository needs. Kept as a composite action so the package list has
  a single source of truth instead of one copy per job.

inputs:
  extra-packages:
    description: >-
      Space-separated additional apt packages to install in the same
      transaction (packaging tools, inspection tools, ...).
    required: false
    default: ""
  container-toolchain:
    description: >-
      Set to "true" in a bare distribution container (`container: ubuntu:22.04`)
      to also install the compiler toolchain and the archive tools that a
      hosted runner image ships and a base image does not. The container must
      already have sudo: the step that installs git and curl before
      `actions/checkout` installs it too.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        CONTAINER_TOOLCHAIN: ${{ inputs.container-toolchain }}
      run: |
        set -euo pipefail
        toolchain=""
        if [ "$CONTAINER_TOOLCHAIN" = "true" ]; then
          toolchain="build-essential clang file libclang-dev pkg-config python3 unzip xz-utils zstd"
        fi
        # Azure's apt mirrors return the odd 5xx or truncated Release file, and
        # a bare `apt-get update` has no retry of its own. Every Linux cargo job
        # in run_tests.yml, release.yml, and the libghostty workflows shares
        # this step, so the apt retry setting and the update loop here cover
        # all of them: apt retries each download 3 times, the install included.
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        for attempt in 1 2 3; do
          sudo apt-get update && break
          echo "::warning::apt-get update failed (attempt $attempt/3)"
          [ "$attempt" -lt 3 ] || { echo "::error::apt-get update failed 3 times"; exit 1; }
          sleep $((attempt * 10))
        done
        # sudo resets the environment, and tzdata waits on a prompt in a
        # container unless the frontend is non-interactive.
        # shellcheck disable=SC2086 # word splitting is the point for the package lists
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
          libfontconfig1-dev \
          libfreetype6-dev \
          libvulkan-dev \
          libwayland-dev \
          libx11-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb1-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          $toolchain \
          $EXTRA_PACKAGES

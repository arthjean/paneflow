name: Linux build dependencies
description: >-
  Install the GPUI / Blade / fontconfig system libraries every Linux cargo job
  in this repository needs. Kept as a composite action so the package list has
  a single source of truth instead of one copy per job.

inputs:
  extra-packages:
    description: >-
      Space-separated additional apt packages to install in the same
      transaction (packaging tools, inspection tools, ...).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        # Azure's apt mirrors return the odd 5xx or truncated Release file, and
        # a bare `apt-get update` has no retry of its own. Five jobs share this
        # step, so one retry loop here covers all of them.
        for attempt in 1 2 3; do
          sudo apt-get update && break
          echo "::warning::apt-get update failed (attempt $attempt/3)"
          [ "$attempt" -lt 3 ] || { echo "::error::apt-get update failed 3 times"; exit 1; }
          sleep $((attempt * 10))
        done
        # shellcheck disable=SC2086 # word splitting is the point for EXTRA_PACKAGES
        sudo apt-get install -y \
          libfontconfig1-dev \
          libfreetype6-dev \
          libvulkan-dev \
          libwayland-dev \
          libx11-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb1-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          $EXTRA_PACKAGES

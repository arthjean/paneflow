name: run_tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Match Zed's pattern (run_tests.yml): on PR branches, collapse runs on the
# same ref so a new push cancels any in-flight CI for that branch. On main,
# every commit gets its own group (keyed by SHA) so we never cancel a real
# post-merge run. Without this, fast successive pushes on a feature branch
# pile up 30-min-cancelled runs in the history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN. Every job in this workflow
# only reads the repo (checkout + cargo + cache). If a future job ever
# needs write (push a tag, post a PR comment), it must elevate
# explicitly via `permissions: contents: write` at the job level -
# making the escalation visible in code review rather than implicit.
permissions:
  contents: read

# -e fail-on-error, -u error-on-unset, -o pipefail propagate pipe
# failures. Never -x: xtrace echoes secrets and multi-line values into the
# public log, and scripts/check-workflows.sh rejects it. Per-step
# `shell: pwsh` overrides this default.
defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Line tables keep file and line in a panic backtrace and drop the rest of
  # the debug info, most of what a debug `target/` weighs. The rust-cache
  # entries of this workflow share the repository's 10 GB cache quota with
  # the one of `perf-ab.yml`.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Mirrors Zed's `orchestrate` job pattern (run_tests.yml in
  # zed-industries/zed): a cheap ubuntu-latest filter that gates every
  # expensive downstream leg on what the PR actually touched.
  #
  # Outputs:
  #   - rust:             any file the build reads changed: whole source
  #                       directories, manifests, and the non-Rust inputs that
  #                       scripts/check-ci-filter-coverage.sh finds cited by
  #                       include_str!, include_bytes!, #[folder] and
  #                       rerun-if-changed
  #   - rendering:        the GPUI paint / font / theme paths the visual
  #                       smoke jobs are designed to protect
  #
  # Gating posture (US-018 AC5 etc.): the macos-15 / windows-2022
  # runners are 14× / 2× pricier than ubuntu-latest and contribute
  # most of CI wall-clock. The path filter short-circuits them on
  # docs-only / non-workflow .github/** PRs.
  #
  # Filter scope: CI, release, security, and packaging files get their
  # own signals so workflow-gate changes cannot self-skip into a false
  # green. Rust jobs still skip for docs-only changes.
  orchestrate:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust }}
      rendering: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rendering }}
      ci: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci }}
      security: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.security }}
      release_packaging: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.release_packaging }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows }}
    steps:
      # `dorny/paths-filter` fetches the base ref it needs on its own, so a
      # shallow checkout is enough here.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'src-app/**'
              - 'crates/**'
              - 'native/**'
              - 'skills/**'
              - 'bench/baselines/**'
              - 'bench/fixtures/**'
              - 'protocol/**'
              - 'schemas/**'
              - 'examples/**'
              - 'runtimes/**'
              - 'mcps/**'
              - 'fuzz/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.config/nextest.toml'
              - 'assets/PaneFlow.ico'
              - 'packaging/wix/main.wxs'
              - 'docs/user/configuration/schema.md'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
            workflows:
              - '.github/**'
            security:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/audit.yml'
              - '.github/workflows/run_tests.yml'
            release_packaging:
              - '.github/workflows/release.yml'
              - '.github/workflows/repo_publish.yml'
              - '.github/workflows/update_cask.yml'
              - 'packaging/**'
              - 'assets/**'
              - 'scripts/**'
            rendering:
              # GPUI Element + paint pipeline (where c3e2331 lived)
              - 'src-app/src/terminal/element/**'
              - 'src-app/src/terminal/view.rs'
              - 'src-app/src/terminal/view/**'
              # Font resolution + embedded fallback wiring
              - 'src-app/src/fonts.rs'
              - 'src-app/src/terminal/element/font.rs'
              # Theme model + active_theme() (affects glyph colors,
              # contrast, and the resolved family chain on macOS Core
              # Text + Windows DirectWrite).
              - 'src-app/src/theme/**'
              # Window chrome / CSD - affects content rect + DPR on both
              # macOS (NSWindow) and Windows (HWND).
              - 'src-app/src/window_chrome/**'
              # Pane / layout - emits the GPUI flex tree that hosts the
              # terminal element; a regression here can produce 0-sized
              # frames that no-op the paint pass without crashing.
              - 'src-app/src/pane.rs'
              - 'src-app/src/layout/render.rs'
              - 'src-app/tests/flex_nchild.rs'

  # Linux quality gates run as 2 parallel jobs, style and tests, so the
  # wall-clock time of the CI run is max(jobs) instead of sum(steps). The
  # helper size budget runs inside the test job, on the `release-min`
  # helpers the test build already produces. The thin-LTO release build of
  # the workspace is covered by `linux_aarch64_check` and, for the
  # application and the host on x86_64, by `perf_gates` and the release.
  #
  # Each job pins ubuntu-22.04 (matches release.yml matrix legs, same
  # glibc 2.35 + system library set - see US-004 in
  # prd-v0.2.0-release-hardening). Do NOT revert to ubuntu-latest;
  # GitHub began rolling that label to 24.04 in early 2025 and the
  # drift would silently diverge CI from release.
  #
  # rust-cache keys per job so they don't fight over the same cache
  # slot. Only a run on `main` saves an entry (`save-if`): a pull request
  # restores the entry `main` wrote and never writes one of its own.
  #
  # Four jobs keep an entry: `run_tests_linux`, `linux_aarch64_check`,
  # `macos_check` and `windows_check`. Every entry carries its own copy of
  # the cargo registry and git checkouts, about 0.85 GB of which the Zed
  # repository alone is 406 MB, so six entries measured 9.9 GB on
  # 2026-11-10 and left no room for the `perf-ab.yml` entry under the
  # 10 GB quota. `check_style` and `perf_gates` build without a cache: on
  # that day their entries saved 5.3 and 3.6 minutes for 1.1 and 1.4 GB,
  # the two worst ratios of the six.

  check_style:
    name: Style (fmt + clippy)
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.rust == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # Every action in every workflow and composite action, `actions/*`
      # included, runs pinned to a full commit SHA, and the GitHub API
      # confirms each SHA is a commit rather than an annotated tag object.
      # No shell traces with -x, and only `main` writes a rust-cache entry.
      # `test-ci-scripts.sh` runs the CI scripts against fixtures.
      - name: Workflow lint (action pins, no xtrace, cache policy)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_WORKFLOWS_REMOTE: required
        run: scripts/check-workflows.sh
      - name: Install minisign for the signature check tests
        run: bash scripts/install-minisign.sh "$RUNNER_TEMP/minisign"
      - name: CI script tests
        run: scripts/test-ci-scripts.sh
      - name: Path filter covers every build input
        run: scripts/check-ci-filter-coverage.sh
      - name: No new wall-clock budget in a unit test
        run: scripts/check-test-wallclock.sh
      - uses: ./.github/actions/fetch-libghostty

      - uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  run_tests_linux:
    name: Tests (Linux x86_64)
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.rust == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-libghostty

      - uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: run_tests_linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      # The three embedded helpers have hard size caps, measured on Linux
      # x86_64 only. `src-app/build.rs` builds them under the `release-min`
      # profile with every build of `paneflow-app`, the test build included,
      # so the test step above has already produced the exact binaries a
      # release embeds and no separate release build is needed to measure
      # them. The per-helper caps live in the script; the total is read from
      # `EMBED_SIZE_LIMIT_BYTES` in `src-app/build.rs`. It runs after a
      # failing test too, so a flaky test cannot hide a size regression.
      - name: Helper binary size budget
        if: ${{ !cancelled() }}
        run: scripts/check-helper-sizes.sh

      - name: Report failing and flaky tests
        if: ${{ !cancelled() }}
        run: scripts/ci-test-report.sh target/nextest/ci/junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-linux-x86_64
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # Performance gates (prd-performance-gates EP-003). Deterministic work
  # budgets for the host, the worker and the desktop, the allocation columns
  # of the terminal and editor suites, and two wide time bounds that protect
  # a written contract (hook response, stale-socket startup). The budgets
  # live in crates/paneflow-host/tests/persistent_baseline/gates.rs and
  # scripts/perf-gates.sh reproduces the job locally. The desktop runs the
  # release build under Xvfb with Mesa lavapipe, the configuration the
  # US-003 spike validated on ubuntu-24.04 (bench/README.md, "Desktop sans
  # écran"), which is why this job does not share the 22.04 image the
  # release-parity jobs pin. It builds without a cache: the `gates` profile
  # keeps a cold build inside the job's bound, and its rust-cache entry
  # saved 3.6 minutes for 1.4 GB of the cache quota.
  perf_gates:
    name: Performance gates (Linux x86_64)
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.rust == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-libghostty

      - uses: ./.github/actions/linux-build-deps
        with:
          extra-packages: mesa-vulkan-drivers xvfb xdotool

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"

      - name: Run the performance gates
        run: scripts/perf-gates.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-gates
          path: target/perf-gates/
          retention-days: 14
          if-no-files-found: warn

  # cargo-deny gate. BLOCKING since 2026-05-27 - promoted from
  # warn-only after the lockfile reached audit-clean (Marvin Attack
  # ignored with documented rationale, GPL-3 transitive deps from
  # GPUI accepted globally, bitstream-io 4.10 dropped yanked core2).
  #
  # The graduated severity belongs to deny.toml, not to a CI flag:
  #   * advisories.vulnerabilities → hard error (deny, cargo-deny default)
  #   * advisories.unmaintained → workspace-scoped warn
  #   * advisories.yanked → warn
  #   * advisories.ignore = [...] → explicit list with re-evaluation
  #     triggers (per-advisory rationale documented inline)
  #   * licenses → allow-list including GPL-3 + GPL-3-or-later
  #   * sources → unknown-registry / unknown-git = deny
  # `unused-ignored-advisory = "warn"` in deny.toml surfaces stale
  # ignores as the dep graph evolves, so the list doesn't rot.
  #
  # The previous `continue-on-error: true` posture was an anti-pattern
  # (shnatsel's cargo-audit retirement post explicitly names it):
  # the job appeared green in the UI, branch protection became
  # decorative, and a real CVE could ship while looking the same as
  # a noisy false positive. Following Bevy's reference pattern
  # (bevyengine/bevy/.github/workflows/dependencies.yml).
  #
  # Gate on dependency/security inputs plus CI changes, so deny.toml and
  # audit workflow edits cannot land with the audit job skipped.
  security_audit:
    name: Security Audit (cargo-deny)
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.rust == 'true' ||
      needs.orchestrate.outputs.security == 'true' ||
      needs.orchestrate.outputs.ci == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"

      # The release binary, at the version and SHA-256 pinned in the script.
      # `audit.yml` installs it through the same script, so the PR gate and
      # the daily audit can never disagree about the same lockfile. Nothing
      # compiles in this job, so it has no rust-cache entry.
      - name: Install cargo-deny (prebuilt, pinned digest)
        run: scripts/install-cargo-deny.sh

      # Only the network fetches are retried, and only on a transient network
      # signature. The check runs offline and is never retried: a real
      # advisory (`error[vulnerability]`, `error[unmaintained]`) fails once,
      # immediately. An unreachable advisory database fails the fetch, so it
      # can never silently pass.
      - name: Fetch crates and the advisory database
        run: |
          scripts/ci-retry-network.sh cargo fetch --locked
          scripts/ci-retry-network.sh cargo deny fetch db

      - name: cargo deny check advisories licenses sources
        run: cargo deny --frozen check --disable-fetch advisories licenses sources

  # zizmor audits every workflow and composite action whenever anything
  # under .github/ changes, and fails on a finding of high severity. Its
  # online audits (impostor commits, known-vulnerable actions, ref and
  # version mismatches) read the GitHub API with the job token. Justified
  # exceptions live in .github/zizmor.yml, each with its reason.
  workflow_audit:
    name: Workflow audit (zizmor)
    needs: orchestrate
    if: needs.orchestrate.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor@1.32.0

      - name: zizmor, high severity fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml --format github --min-severity high .github

  # US-001 (prd-macos-port.md): smoke build on Apple Silicon so the PaneFlow
  # dependency closure at the pinned GPUI rev (0b984b5) is proven to compile
  # on aarch64-apple-darwin before any of EP-002..EP-005 lands. The job runs
  # on every PR so a regression in platform-gated code is caught at the PR
  # gate rather than at release cut.
  #
  # Runner: macos-15 (Apple Silicon M1, 3 vCPU / 7 GB, Xcode + CLT preinstalled).
  # Fallback: if a PR consistently exceeds 20 min wall time on macos-15,
  # swap to `macos-15-xlarge` (6 vCPU, paid tier) and note the rationale
  # in the PR description per US-001 AC5.
  macos_check:
    name: macOS aarch64 smoke build
    # US-018 AC5: only run when Rust-relevant files change. `needs: orchestrate`
    # waits for the cheap filter job (runs on ubuntu-latest, ~seconds) and
    # short-circuits the 14× pricier macos-15 runner on docs-only /
    # non-workflow .github/** PRs.
    #
    # The `rust` filter matches whole directories (native/**, crates/**,
    # src-app/**), so a change to the pinned archive, its manifest, the -sys
    # crate or the ghostty crate also runs this job: it is the only PR gate
    # that type-checks the Ghostty runtime against aarch64-apple-darwin. A
    # docs-only PR still skips it.
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.rust == 'true' ||
      needs.orchestrate.outputs.rendering == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true'
    runs-on: macos-15
    outputs:
      binary: ${{ steps.binary.outputs.artifact-id }}
    # US-013 AC5: the libghostty steps add a native archive link to every
    # cargo invocation here. Budget is a 25 min median over the first five
    # runs; past that, switch to `macos-15-xlarge` and record the rationale in
    # the PR per the US-001 AC5 note above. The timeout is the hard backstop.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-libghostty

      # US-003 - fail fast if the runner image drifts away from a full Xcode
      # install. The macos-15 hosted image ships Xcode 15+ with the Metal
      # toolchain preinstalled, so under normal conditions every check here
      # succeeds silently; the value is turning an otherwise cryptic mid-compile
      # "Metal.h: no such file" error into a clearly labelled preflight failure
      # that points at the runner configuration rather than the Rust source.
      #
      # The same step is expected to be ported to release.yml's macos-15 matrix
      # leg when US-019 adds it - keep this block in sync across workflows.
      - name: Verify Xcode CLT + Metal toolchain
        run: |
          set -euo pipefail

          CLT_PATH="$(xcode-select -p 2>/dev/null || true)"
          if [ -z "$CLT_PATH" ] || [ ! -d "$CLT_PATH" ]; then
            echo "::error::Xcode Command Line Tools not found (xcode-select -p returned '$CLT_PATH'). GitHub macos-15 runners should ship Xcode preinstalled - this indicates a runner image drift or a misconfigured self-hosted runner."
            exit 1
          fi
          echo "Xcode CLT path: $CLT_PATH"

          SDK_PATH="$(xcrun --show-sdk-path 2>/dev/null || true)"
          if [ -z "$SDK_PATH" ] || [ ! -d "$SDK_PATH" ]; then
            echo "::error::macOS SDK not found (xcrun --show-sdk-path returned '$SDK_PATH')."
            exit 1
          fi
          echo "macOS SDK path: $SDK_PATH"

          if ! xcrun --find metal >/dev/null 2>&1; then
            echo "::error::Metal compiler (xcrun --find metal) not available - the Metal Developer Tools component is missing from this Xcode install. gpui_macos compiles .metal shaders and will fail without it."
            exit 1
          fi
          echo "Metal compiler: $(xcrun --find metal)"

          METAL_HEADERS="$SDK_PATH/System/Library/Frameworks/Metal.framework/Headers"
          if [ ! -d "$METAL_HEADERS" ]; then
            echo "::error::Metal framework headers not found at $METAL_HEADERS. gpui_macos Objective-C bridging will fail with header-not-found errors."
            exit 1
          fi
          echo "Metal framework headers: $METAL_HEADERS"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-darwin
          # US-018 AC2 adds cargo fmt + cargo clippy steps below - those
          # need the rustfmt + clippy components, which dtolnay's action
          # does NOT install by default even when `targets:` is set.
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # US-018 AC2 - formatting + lint on macOS. fmt is platform-agnostic
      # but runs here too so formatter version drift between local Linux
      # dev machines and the macOS runner never sneaks past the gate.
      - name: cargo fmt --check
        run: cargo fmt --check

      # clippy is scoped to the aarch64-apple-darwin target so it
      # type-checks platform-gated modules (runtime_paths.rs macOS arm,
      # install_method::AppBundle, update::checker::AssetFormat::Dmg,
      # etc.) that the ubuntu `check` job would otherwise miss.
      #
      # Ghostty is the only terminal engine and is linked unconditionally, so
      # this is what type-checks the native modules against a Darwin target.
      - name: cargo clippy (aarch64-apple-darwin)
        run: >-
          cargo clippy --workspace --all-targets --locked
          --target aarch64-apple-darwin -- -D warnings

      # The release build and its artifact come before the unit tests, so a
      # failing test still leaves macos_render_smoke a binary to render.
      - name: cargo build --release (aarch64-apple-darwin)
        run: cargo build --release -p paneflow-app -p paneflow-host --locked --target aarch64-apple-darwin

      # AC3 - verify the produced binary is a Mach-O arm64 executable.
      - name: Verify Mach-O arm64 binary
        run: |
          BIN=target/aarch64-apple-darwin/release/paneflow
          test -f "$BIN"
          file "$BIN"
          file "$BIN" | grep -q 'Mach-O 64-bit executable arm64'

      # AC4 - on failure the job logs already capture the failing crate and
      # error; uploading the binary on success gives reviewers an artifact
      # they can `file`/`otool` locally if something downstream misbehaves.
      - name: Upload aarch64 binary artifact
        id: binary
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paneflow-aarch64-apple-darwin
          path: |
            target/aarch64-apple-darwin/release/paneflow
            target/aarch64-apple-darwin/release/paneflow-host
            target/aarch64-apple-darwin/release/paneflow-session-fixture
          if-no-files-found: error
          retention-days: 7

      # The two libghostty gates below used to run in `libghostty-macos.yml`
      # on a second macos-15 runner, after rebuilding the release binary this
      # job has just built. `PANEFLOW_LIBGHOSTTY_DIR` stays unset, so cargo
      # links `native/libghostty/prebuilt/<target>`, the archive a release
      # links. libghostty must be statically linked into the binary and its
      # notices must ship.
      - name: Enforce the libghostty static link and shipped notices
        run: |
          scripts/verify-libghostty-macos.sh \
            --binary target/aarch64-apple-darwin/release/paneflow \
            --notice native/libghostty/THIRD_PARTY_NOTICES.md

      # The only end-to-end proof on this runner: it opens a real Darwin PTY,
      # spawns `/bin/sh`, drives a resize through both the PTY and the engine,
      # reads the shell's `stty size` answer back, asserts the marker reached
      # the libghostty snapshot, and checks the child was reaped. It is the
      # same binary and the same assertions the Linux leg runs.
      - name: End-to-end libghostty PTY smoke
        run: |
          cargo build --release --locked \
            -p paneflow-ghostty-smoke \
            --features native \
            --target aarch64-apple-darwin
          target/aarch64-apple-darwin/release/paneflow-ghostty-smoke

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146

      # `--target` pins compilation to aarch64-apple-darwin so test
      # binaries are native Mach-O and the test run exercises the real
      # macOS codepath, not a Linux-host proxy.
      - name: cargo nextest run --workspace
        run: >-
          cargo nextest run --workspace --locked --profile ci
          --target aarch64-apple-darwin

      - name: Report failing and flaky tests
        if: ${{ !cancelled() }}
        run: scripts/ci-test-report.sh target/nextest/ci/junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-macos-aarch64
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      # AC1 - cargo check must exit 0 with no linker errors.
      - name: cargo check (aarch64-apple-darwin)
        run: cargo check --workspace --locked --target aarch64-apple-darwin

  # ───────────────────────────────────────────────────────────────────────
  # Visual rendering smoke test - macOS aarch64.
  #
  # Catches the exact class of regression fixed in commit c3e2331
  # ("fix(font): macOS empty-text rendering across sidebar, tabs, and
  # terminal"): a PaneFlow build that compiles, links, and notarizes
  # cleanly but renders zero glyphs because Core Text inside a `.app`
  # bundle silently fails to surface the configured monospace family
  # and no embedded font fallback is wired. The release pipeline never
  # noticed because no leg ever launched the `.app` - every gate was
  # compile/sign/notarize, none was visual. This job closes that hole at
  # the PR gate so the regression cannot reach `main`.
  #
  # Pipeline: download the binary built by `macos_check` → wrap it in
  # the same `.app` skeleton `release.yml` ships → launch the binary
  # inside the bundle (so Core Text sees the bundle context, exactly
  # like an end-user install) → screencapture → soft OCR sanity check.
  # The screenshot is always uploaded so reviewers can eyeball the
  # PR's macOS rendering even when the OCR gate is happy.
  #
  # Gates:
  #   * HARD - `font: family=...` line MUST appear in the app
  #     log (proves the renderer reached `cached_font_config()`, i.e.
  #     the app didn't crash before first frame).
  #   * SOFT - OCR finds ≥10 alphanumeric chars (the macOS menubar
  #     alone passes this trivially when rendering works; failure
  #     means we're staring at a black screen or empty cells).
  #
  # Runner: macos-15 hosts a real macOS user session with WindowServer
  # access - GUI apps launch and render normally, exactly the pattern
  # used by Electron / Flutter / native-Cocoa CI setups.
  # ───────────────────────────────────────────────────────────────────────
  macos_render_smoke:
    name: macOS aarch64 render smoke (visual)
    needs: [orchestrate, macos_check]
    # Gate on the `rendering` sub-filter (not the broad `rust` filter):
    # the c3e2331-class regression this job exists to catch can only
    # ride in on edits to the rendering paths declared by the `changes`
    # job. A pure config-file or non-render Rust PR cannot regress
    # macOS Core Text empty-text rendering, so spending 10-15 min on a
    # macos-15 runner on every such PR is wasted spend.
    #
    # It runs whenever macos_check uploaded its binary, even if a unit test
    # failed after the upload, and is skipped when the build itself failed.
    if: >-
      ${{ !cancelled() && needs.macos_check.outputs.binary != '' && (
      needs.orchestrate.outputs.rendering == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true') }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download paneflow binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paneflow-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/

      - name: Restore executable bit
        # actions/upload-artifact strips the executable bit on macOS/
        # Linux outputs (https://github.com/actions/upload-artifact/issues/38).
        # Without this, `bundle-macos.sh`'s `install -m 0755` would copy
        # a non-executable file and `open` would fail with EACCES.
        run: chmod +x target/aarch64-apple-darwin/release/paneflow target/aarch64-apple-darwin/release/paneflow-host target/aarch64-apple-darwin/release/paneflow-session-fixture

      - name: Bundle .app
        # Reuse the production bundling script so the smoke test exercises
        # the SAME `.app` skeleton end-users get - Info.plist, .icns,
        # MacOS/paneflow layout. Unsigned: signing is not what the bug
        # was about (the original c3e2331 root cause reproduced equally
        # in unsigned bundles per Core Text's bundle-context behavior),
        # and skipping codesign keeps this gate free of Apple secrets.
        run: |
          set -euo pipefail
          version="$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          bash scripts/bundle-macos.sh --version "$version" --arch aarch64

      - name: Create a persistent fixture session
        run: |
          set -euo pipefail
          export PANEFLOW_HOME="$RUNNER_TEMP/paneflow-render-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export PANEFLOW_SOCKET_PATH="/tmp/paneflow-render-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sock"
          export PANEFLOW_ALLOW_SOCKET_OVERRIDE=1
          printf 'PANEFLOW_HOME=%s\nPANEFLOW_SOCKET_PATH=%s\nPANEFLOW_ALLOW_SOCKET_OVERRIDE=1\n' "$PANEFLOW_HOME" "$PANEFLOW_SOCKET_PATH" >> "$GITHUB_ENV"
          mkdir -p "$PANEFLOW_HOME"
          printf '%s' '{"telemetry":{"enabled":false},"terminal":{"cursor_blink":"off"}}' > "$PANEFLOW_HOME/paneflow.json"
          printf '%s' '{"version":3,"active_workspace":0,"workspaces":[]}' > "$PANEFLOW_HOME/session.json"
          printf '%s' '{"width":1200,"height":800}' > "$PANEFLOW_HOME/window-state.json"
          printf '%s' '7f03d6ba-1249-4a78-92dc-96f77e8d10a2' > "$PANEFLOW_HOME/telemetry_id"
          "$GITHUB_WORKSPACE/dist/PaneFlow.app/Contents/MacOS/paneflow" host start
          "$GITHUB_WORKSPACE/dist/PaneFlow.app/Contents/MacOS/paneflow-host" --home "$PANEFLOW_HOME" session create \
            --cwd "$GITHUB_WORKSPACE" --shell "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/paneflow-session-fixture" -- idle > created-session.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          session_id = json.loads(Path("created-session.json").read_text())["session"]
          surface = {"surface_type": "terminal", "name": "Fixture", "session": session_id}
          workspace = {"title": "smoke", "cwd": os.environ["GITHUB_WORKSPACE"], "tabs": [{"title": "Fixture", "layout": {"type": "pane", "surfaces": [surface]}}]}
          Path(os.environ["PANEFLOW_HOME"], "session.json").write_text(json.dumps({"version": 3, "active_workspace": 0, "workspaces": [workspace]}))
          PY

      - name: Launch .app and capture screenshot
        run: |
          set -euo pipefail
          APP="dist/PaneFlow.app"

          # Launch the binary INSIDE the bundle directly (rather than
          # `open -a`) so stdout/stderr can be redirected - `open` does
          # not tee child output and the `font: family=` log
          # line is our hard gate. The bundle path is preserved, so
          # Info.plist + Resources/ load correctly and Core Text sees
          # the same bundle context as a real install.
          RUST_LOG=info "$APP/Contents/MacOS/paneflow" \
            >paneflow.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; sleep 2; kill -9 "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true' EXIT

          # Poll for the first-paint marker instead of betting the job on a
          # fixed cold-launch budget. Typical first paint on macos-15 (M1,
          # 3 vCPU) is under 5s, but the gate below is HARD: a contended
          # runner that pushed past a flat 10s sleep would have failed the
          # job for a timing race rather than a rendering regression.
          # Stop early if the process dies, so a crash is still reported by
          # the missing-log gate rather than waiting out the whole deadline.
          launched_at=$SECONDS
          while [ $((SECONDS - launched_at)) -lt 90 ]; do
            if grep -q "font: family=" paneflow.log 2>/dev/null; then
              echo "first paint reached after $((SECONDS - launched_at))s"
              break
            fi
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done

          fixture_ready=false
          launched_at=$SECONDS
          while [ $((SECONDS - launched_at)) -lt 90 ]; do
            if "$APP/Contents/MacOS/paneflow" ls > surfaces.json 2>fixture-read.err.log; then
              surface_id=$(python3 -c 'import json; s=json.load(open("surfaces.json"))["surfaces"]; print(s[0]["surface_id"] if len(s) == 1 else "")')
              if [ -n "$surface_id" ] && "$APP/Contents/MacOS/paneflow" read "$surface_id" --raw > fixture-output.txt 2>>fixture-read.err.log && grep -q 'fixture idle' fixture-output.txt; then
                fixture_ready=true
                break
              fi
            fi
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done

          # The log line fires when the renderer resolves the font, a moment
          # before the frame is actually presented. Let the compositor land it
          # before the screenshot.
          sleep 3

          # `-x` skips the camera-shutter sound; captures every display.
          screencapture -x screenshot.png

          if [ "$fixture_ready" != true ]; then
            echo "::error::The restored terminal never exposed the owned fixture output through paneflow read."
            exit 1
          fi

          # HARD GATE: the resolved-font log line must be present.
          # Absence means the app crashed before reaching
          # cached_font_config() - i.e. before the renderer ever asked
          # for a font, which is upstream of every rendering-correctness
          # property this job exists to verify.
          echo "── Resolved font ──"
          if ! grep "font: family=" paneflow.log; then
            echo "::error::No 'font: family=' line in app log. The app likely crashed before first render - paneflow.log + screenshot.png artifacts will pin down the exact failure."
            exit 1
          fi

      - name: Stop isolated persistent runtime
        if: always()
        run: |
          if [ -n "${PANEFLOW_HOME:-}" ] && [ -x dist/PaneFlow.app/Contents/MacOS/paneflow ]; then
            dist/PaneFlow.app/Contents/MacOS/paneflow serve stop || true
            dist/PaneFlow.app/Contents/MacOS/paneflow host stop --force
          fi

      - name: OCR sanity check (text rendered?)
        # Soft gate: tesseract output is fuzzy and we don't want flaky
        # OCR to block PRs. The signal still surfaces in the CI log
        # (alphanumeric char count) and the screenshot artifact is
        # available for human review on every run.
        continue-on-error: true
        run: |
          set -euo pipefail
          brew install --quiet tesseract
          text="$(tesseract screenshot.png - 2>/dev/null || true)"
          echo "── OCR output (first 50 lines) ──"
          echo "$text" | head -50
          char_count="$(echo "$text" | tr -cd '[:alnum:]' | wc -c | tr -d ' ')"
          echo "OCR alphanumeric chars: $char_count"
          # Threshold rationale: the macOS menubar (Apple logo,
          # "Finder", clock, date) alone OCRs to ~30+ chars on a healthy
          # session. <10 chars almost always means rendering is broken
          # - either the screen is black or every glyph rendered as a
          # blank cell, which is the c3e2331 failure mode.
          if [ "$char_count" -lt 10 ]; then
            echo "::warning::OCR found <10 alphanumeric chars. Visual rendering may be broken - inspect screenshot.png artifact."
          fi

      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos_render_smoke
          path: |
            screenshot.png
            paneflow.log
            created-session.json
            surfaces.json
            fixture-output.txt
            fixture-read.err.log
          if-no-files-found: warn
          retention-days: 7

  # US-003 + US-018 (prd-windows-port.md): windows-2022 PR gate. Runs the
  # full Rust quality suite (fmt + clippy + test + check) against the
  # x86_64-pc-windows-msvc target, plus toolchain/WiX verification. US-003
  # stood up the runner + WiX scaffolding; US-018 promotes the job from
  # "smoke cargo check with continue-on-error" to a required quality gate
  # now that EP-W2 (US-004..US-008) + EP-W3 (US-009) have cfg-guarded the
  # POSIX-locked code that previously broke the cross-compile.
  #
  # Runner: windows-2022 hosted image ships VS 2022 Build Tools + the
  # Windows SDK preinstalled but does NOT expose cl/link/signtool on the
  # default shell PATH. scripts/msvc-dev-env.ps1 loads the VS dev env (cl,
  # link, lib) from vcvarsall.bat and an inline PowerShell step prepends
  # the latest SDK bin dir (for signtool.exe) to $GITHUB_PATH.
  #
  # Time budget (US-018 AC-4): <5 min cached. Swatinem/rust-cache handles
  # cargo's share (keyed on `x86_64-pc-windows-msvc` so Linux/macOS cache
  # slots don't collide); actions/cache covers WiX's ~10 MB global tool
  # install. `timeout-minutes` is a runaway guard, not the SLA.
  windows_check:
    name: Windows x86_64 libghostty check
    # Runs for Rust, CI, and release-packaging changes so Windows MSVC
    # regressions are caught before a tag cut.
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.rust == 'true' ||
      needs.orchestrate.outputs.rendering == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true'
    runs-on: windows-2022
    # cargo steps must run under pwsh, NOT the workflow-default bash: Git
    # Bash prepends C:\Program Files\Git\usr\bin to PATH, whose coreutils
    # `link.exe` shadows the MSVC linker and breaks every build-script link
    # ("/usr/bin/link: extra operand"). pwsh keeps the vcvarsall.bat PATH so
    # the real link.exe wins. (The pwsh-explicit steps above are unchanged.)
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 50
    outputs:
      binary: ${{ steps.binary.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-libghostty

      # Load VS 2022 Build Tools env: cl.exe, link.exe, lib.exe on PATH,
      # INCLUDE/LIB/LIBPATH set. Required by AC-2's `where cl.exe link.exe`.
      # x64 arch targets the same toolchain the rustc msvc triple uses.
      - name: Setup MSVC developer environment
        shell: pwsh
        run: ./scripts/msvc-dev-env.ps1 -Arch x64

      # signtool.exe ships in the Windows 10 SDK bin dir but is not on the
      # VS Dev Cmd PATH. Resolve the highest-versioned SDK bin subdir and
      # append it to $GITHUB_PATH so later steps (and US-015's signing
      # script work) see it. Explicit `throw` on not-found turns a silent
      # drift of the runner image into a labelled preflight failure.
      - name: Add Windows SDK bin to PATH (for signtool)
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkBin = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdkBin) {
            throw "Windows 10 SDK bin directory not found under $sdkRoot - runner image drift?"
          }
          $signtoolDir = Join-Path $sdkBin.FullName 'x64'
          Write-Output "Using SDK bin: $signtoolDir"
          Add-Content -Path $env:GITHUB_PATH -Value $signtoolDir

      # AC-2 - toolchain binaries all on PATH.
      - name: Verify signtool.exe / cl.exe / link.exe on PATH
        shell: pwsh
        run: |
          where.exe signtool.exe
          where.exe cl.exe
          where.exe link.exe

      # US-003 AC-1 + US-018 AC-1: Rust toolchain with rustfmt + clippy
      # components (required by the fmt/clippy steps below) and the MSVC
      # cross-compile target.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Enabling the app feature makes every relevant Cargo command compile
      # the Windows Ghostty host and link the reviewed static archive from
      # native/libghostty/prebuilt. The sys build script validates that native
      # inventory, including the absence of a ghostty-vt DLL, before linking.

      # Note: WiX toolset is NOT installed in this PR gate. The MSI build
      # lives in release.yml only (US-016), which uses WiX v3 (candle.exe +
      # light.exe) via the windows-2022 preinstalled toolset paired with
      # cargo-wix 0.3.9 (cargo-wix has no WiX v4/v5 backend - see
      # volks73/cargo-wix#202). Installing `dotnet tool install --global wix`
      # here would surface WiX v5 - incompatible with the release pipeline
      # and unused by the fmt/clippy/test/check gate below, so it's omitted
      # to keep the CI check accurate to what it verifies.

      # ─── US-018 AC-2: quality-gate steps in mandated order ────────────────
      # fmt → clippy → release build → test → check. Each step fails the job fast (`-D
      # warnings` on clippy, `set -e` semantics from GitHub Actions on
      # every step) so a Windows-specific regression surfaces at the PR
      # gate with the exact file:line from rustc/clippy output rather
      # than slipping into release.yml's best-effort Windows leg.

      # AC-2 step 1/4: formatting. `--all` forces every workspace member;
      # `--check` is the non-destructive mode that fails on unformatted
      # code. Runs first because a format failure is cheap and the 3
      # later steps then operate on consistently-formatted source.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # AC-2 step 2/4: clippy. `--target x86_64-pc-windows-msvc` selects
      # the Windows codepaths - cfg-gated modules (terminal::TerminateProcess,
      # install_method::WindowsMsi, ipc's interprocess branch, etc.) are
      # only type-checked when this target is chosen. `-D warnings`
      # promotes every clippy lint + unused-import warning to an error,
      # matching the Linux `check` job pattern (line 74) and the release
      # pipeline's clippy gate.
      - name: cargo clippy --target x86_64-pc-windows-msvc
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      # US-012 (prd-ai-hooks-cross-platform.md) AC - the matrix requires
      # `cargo build --workspace --release` on every leg. On Windows this
      # also triggers the `src-app/build.rs` nested build of
      # `paneflow-shim` + `paneflow-ai-hook`, ensuring their PE binaries
      # embed cleanly via rust-embed and the AI-hook pipeline compiles
      # end-to-end on MSVC. It runs before the unit tests so a failing test
      # still leaves windows_render_smoke a binary to render.
      - name: cargo build --workspace --release
        # LTO ("thin") + codegen-units=1 from [profile.release] are runtime-perf
        # knobs, irrelevant to a CI compile gate, and roughly double the link
        # time. From a cold cache the release build blew past the 30-min timeout
        # - and the kill skips the rust-cache save step, so every run restarted
        # cold (a vicious cycle). Override them here to keep the gate fast; the
        # real LTO release build is still validated by release.yml on every tag.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc

      # Mirror of the macos_check `Upload aarch64 binary artifact` step:
      # exposes the just-built `paneflow.exe` as a workflow artifact so
      # the downstream `windows_render_smoke` job can pull it without
      # paying a second `cargo build` (the cache hit path on subsequent
      # PRs is fast, but the from-scratch path on cold runs is ~5 min).
      - name: Upload x86_64 binary artifact
        id: binary
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paneflow-x86_64-pc-windows-msvc
          path: |
            target/x86_64-pc-windows-msvc/release/paneflow.exe
            target/x86_64-pc-windows-msvc/release/paneflow-host.exe
            target/x86_64-pc-windows-msvc/release/paneflow-session-fixture.exe
          if-no-files-found: error
          retention-days: 7

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146

      # AC-2 step 3/4: tests. Ghostty is linked unconditionally, so the
      # workspace run executes the Windows backend corpus against the real
      # engine. nextest runs each test in its own process inside a job
      # object, so a test killed at its timeout takes its children with it.
      # Only the tests quarantined in .config/nextest.toml are retried.
      - name: cargo nextest run --workspace --target x86_64-pc-windows-msvc
        run: cargo nextest run --workspace --locked --profile ci --target x86_64-pc-windows-msvc

      - name: Report failing and flaky tests
        if: ${{ !cancelled() }}
        shell: bash
        run: scripts/ci-test-report.sh target/nextest/ci/junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows-x86_64
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      # AC-2 step 4/4: final check. Redundant with clippy in practice
      # (clippy is a superset), but kept as a belt-and-braces signal and
      # because the PRD AC lists it explicitly - a bare `cargo check`
      # failure is a clearer error surface than clippy's noisier output
      # when the problem is a pure compile error (missing API, linker
      # symbol, etc.) rather than a lint. No `continue-on-error` anymore
      # (US-003 set it; EP-W2/W3 landing made it unnecessary).
      - name: cargo check --workspace --target x86_64-pc-windows-msvc
        run: cargo check --workspace --locked --target x86_64-pc-windows-msvc

  # ───────────────────────────────────────────────────────────────────────
  # Visual rendering smoke test - Windows x86_64.
  #
  # Mirrors `macos_render_smoke` for the Windows GPUI rendering stack
  # (Direct2D / DirectWrite, DX11 backend GA Oct 2025). Catches the
  # same class of regression: a build that compiles + signs cleanly
  # but renders no glyphs because DirectWrite font enumeration silently
  # fails to surface the configured monospace family. The embedded
  # JetBrains Mono fallback wired by commit c3e2331 protects against
  # this on Windows too - this job verifies the safety net actually
  # holds end-to-end on a hosted runner.
  #
  # Gates:
  #   * HARD - `font: family=...` must appear in the app log.
  #   * SOFT - visual artifact uploaded for human review (no OCR gate
  #     because tesseract on Windows requires a heavier install path
  #     and the screenshot+log signal is already enough to spot the
  #     "boxes drawn, no glyphs" failure mode).
  #
  # Runner: windows-2022 hosts a real Windows desktop session - GUI
  # apps launch and render normally, exactly the pattern used by
  # WPF / WinUI / Electron CI setups.
  # ───────────────────────────────────────────────────────────────────────
  windows_render_smoke:
    name: Windows x86_64 render smoke (visual)
    needs: [orchestrate, windows_check]
    # Depends on windows_check because the smoke job loads the artifact
    # produced by that job. It runs whenever windows_check uploaded it, even
    # if a unit test failed after the upload, and is skipped when the build
    # itself failed.
    if: >-
      ${{ !cancelled() && needs.windows_check.outputs.binary != '' && (
      needs.orchestrate.outputs.rendering == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download paneflow.exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paneflow-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/

      - name: Create a persistent fixture session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PANEFLOW_HOME = Join-Path $env:RUNNER_TEMP "paneflow-render-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:PANEFLOW_SOCKET_PATH = "\\.\pipe\paneflow-render-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "PANEFLOW_HOME=$env:PANEFLOW_HOME" | Add-Content $env:GITHUB_ENV
          $env:PANEFLOW_ALLOW_SOCKET_OVERRIDE = '1'
          "PANEFLOW_SOCKET_PATH=$env:PANEFLOW_SOCKET_PATH" | Add-Content $env:GITHUB_ENV
          'PANEFLOW_ALLOW_SOCKET_OVERRIDE=1' | Add-Content $env:GITHUB_ENV
          $home_dir = $env:PANEFLOW_HOME
          New-Item -ItemType Directory -Force -Path $home_dir | Out-Null
          $cwd = $env:GITHUB_WORKSPACE
          '{"telemetry":{"enabled":false},"terminal":{"cursor_blink":"off"}}' | Set-Content (Join-Path $home_dir 'paneflow.json')
          '{"version":3,"active_workspace":0,"workspaces":[]}' | Set-Content (Join-Path $home_dir 'session.json')
          '{"width":1200,"height":800}' | Set-Content (Join-Path $home_dir 'window-state.json')
          '7f03d6ba-1249-4a78-92dc-96f77e8d10a2' | Set-Content (Join-Path $home_dir 'telemetry_id')
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/paneflow.exe').Path
          $hostExe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/paneflow-host.exe').Path
          $fixtureExe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/paneflow-session-fixture.exe').Path
          & $exe host start
          if ($LASTEXITCODE -ne 0) { throw 'The isolated host could not start' }
          $created = & $hostExe --home $home_dir session create --cwd $cwd --shell $fixtureExe -- idle
          if ($LASTEXITCODE -ne 0) { throw 'The owned fixture session could not start' }
          $created | Set-Content created-session.json
          $sessionId = ($created | ConvertFrom-Json).session
          if (-not $sessionId) { throw 'The host did not return a persistent session identity' }
          $session = @{
            version = 3
            active_workspace = 0
            workspaces = @(@{
              title = 'smoke'
              cwd = $cwd
              tabs = @(@{
                title = ''
                title_source = 'preset'
                layout = @{
                  type = 'pane'
                  surfaces = @(@{
                    surface_type = 'terminal'
                    name = 'Terminal'
                    session = $sessionId
                    cwd = $cwd
                    env = $null
                    focus = $true
                  })
                }
              })
            })
          }
          $session | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $home_dir 'session.json') -Encoding utf8

      - name: Launch paneflow.exe and capture screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "target\x86_64-pc-windows-msvc\release\paneflow.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected $exe to exist after download-artifact step."
          }

          # Launch detached so we can sleep + capture, with stdout +
          # stderr teed to a log file. RUST_LOG=info is required to
          # surface the `font: family=` line emitted by
          # terminal/element/font.rs:215 - the hard gate below greps
          # for it.
          $env:RUST_LOG = 'info'
          $proc = Start-Process -FilePath $exe `
                                -WindowStyle Normal `
                                -PassThru `
                                -RedirectStandardOutput 'paneflow.log' `
                                -RedirectStandardError  'paneflow.err.log'
          try {

            # Poll for the first-paint marker rather than betting the job on a
            # fixed cold-launch budget; the font gate below is HARD, so a
            # contended runner that pushed past a flat 10s sleep would have
            # failed the job for a timing race, not a rendering regression.
            # stdout and stderr are separate files here, and env_logger writes
            # to stderr, so watch both.
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              $seen = @('paneflow.log', 'paneflow.err.log') |
                Where-Object { Test-Path -LiteralPath $_ } |
                ForEach-Object { Select-String -Path $_ -Pattern 'font: family=' -SimpleMatch -Quiet } |
                Where-Object { $_ }
              if ($seen) { break }
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }

            $fixtureReady = $false
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              $listed = & $exe ls 2>fixture-read.err.log
              if ($LASTEXITCODE -eq 0) {
                $listed | Set-Content surfaces.json
                $surfaces = @(($listed | ConvertFrom-Json).surfaces)
                if ($surfaces.Count -eq 1 -and $surfaces[0].surface_id) {
                  $output = & $exe read ([string]$surfaces[0].surface_id) --raw 2>>fixture-read.err.log
                  if ($LASTEXITCODE -eq 0 -and ($output -join "`n").Contains('fixture idle')) {
                    $output | Set-Content fixture-output.txt
                    $fixtureReady = $true
                    break
                  }
                }
              }
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }

            # The log line fires when the renderer resolves the font, a moment
            # before the frame is actually presented.
            Start-Sleep -Seconds 3

            # Capture the primary display via System.Drawing - works on
            # every windows-2022 runner without external tooling. The
            # bounds-then-CopyFromScreen pattern is the canonical .NET
            # screenshot recipe used by every Windows GUI CI setup.
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("$pwd\screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()

            if (-not $fixtureReady) {
              throw 'The restored terminal never exposed the owned fixture output through paneflow read'
            }
          } finally {
            if (-not $proc.HasExited) {
              $proc.Kill()
              if (-not $proc.WaitForExit(5000)) { throw 'The owned desktop did not exit' }
            }
          }

          # Merge stderr into the main log so the grep below picks up
          # log::info! lines (env_logger writes to stderr by default).
          if (Test-Path 'paneflow.err.log') {
            Get-Content 'paneflow.err.log' | Add-Content 'paneflow.log'
          }

          Write-Output "── Resolved font ──"
          $fontLine = Select-String -Path 'paneflow.log' -Pattern 'font: family=' -SimpleMatch
          if (-not $fontLine) {
            Write-Output "::error::No 'font: family=' line in app log. The app likely crashed before first render - paneflow.log + screenshot.png artifacts will pin down the exact failure."
            exit 1
          }
          $fontLine | ForEach-Object { Write-Output $_.Line }

      - name: Stop isolated persistent runtime
        if: always()
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/paneflow.exe'
          if ($env:PANEFLOW_HOME -and (Test-Path -LiteralPath $exe)) {
            & $exe serve stop
            & $exe host stop --force
            if ($LASTEXITCODE -ne 0) { throw 'The isolated host could not stop' }
          }

      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows_render_smoke
          path: |
            screenshot.png
            paneflow.log
            paneflow.err.log
            created-session.json
            surfaces.json
            fixture-output.txt
            fixture-read.err.log
          if-no-files-found: warn
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # US-012 (prd-ai-hooks-cross-platform.md) - matrix completion.
  # Existing jobs cover:
  #   * check         - x86_64-unknown-linux-gnu   (Linux x64 full gate)
  #   * macos_check   - aarch64-apple-darwin       (Apple Silicon full gate)
  #   * windows_check - x86_64-pc-windows-msvc     (Windows x64 full gate)
  # The job below closes the remaining shipping triple:
  #   * linux_aarch64_check   - aarch64-unknown-linux-gnu
  # x86_64-apple-darwin and aarch64-pc-windows-msvc are NOT shipping targets:
  # `native/libghostty/manifest.toml` pins an archive for four triples only,
  # and Ghostty is the sole terminal engine, so there is no portable build to
  # gate on those two. The leg is gated on Rust, CI, and release-packaging
  # paths so docs-only PRs don't burn minutes on the extended matrix.
  # ───────────────────────────────────────────────────────────────────────

  linux_aarch64_check:
    name: Linux aarch64 (aarch64-unknown-linux-gnu)
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.rust == 'true' ||
      needs.orchestrate.outputs.ci == 'true' ||
      needs.orchestrate.outputs.release_packaging == 'true'
    # Native ARM runner (GitHub public preview since late 2024, used
    # by release.yml on the same pattern - see the comment at
    # release.yml:34-37). Same image basis as ubuntu-22.04 so the
    # system-deps list mirrors the x86_64 `check` job above without
    # drift.
    #
    # Fallback posture (US-012 AC unhappy path): if the
    # `ubuntu-22.04-arm` label is ever withdrawn or starts queuing
    # >30 min, fall back to `cross = "0.2.5"` emulated build
    # documented in the AC. `cross`'s Vulkan + X11 sysroot for
    # aarch64-unknown-linux-gnu needs manual header staging; that
    # complexity is why this job prefers the native runner.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-libghostty

      - uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: aarch64-unknown-linux-gnu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # fmt runs here too so formatter-version drift between dev boxes
      # (x86_64) and the arm runner is caught at the PR gate.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (aarch64-unknown-linux-gnu)
        run: cargo clippy --workspace --all-targets --locked --target aarch64-unknown-linux-gnu -- -D warnings

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146

      - name: cargo nextest run --workspace (aarch64-unknown-linux-gnu)
        run: cargo nextest run --workspace --locked --profile ci --target aarch64-unknown-linux-gnu

      - name: Report failing and flaky tests
        if: ${{ !cancelled() }}
        run: scripts/ci-test-report.sh target/nextest/ci/junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-linux-aarch64
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: cargo build --workspace --release (aarch64-unknown-linux-gnu)
        run: cargo build --workspace --release --locked --target aarch64-unknown-linux-gnu

  # ───────────────────────────────────────────────────────────────────────
  # Single aggregator job - mirrors Zed's run_tests.yml `tests_pass`
  # pattern. Every upstream job is listed here; the step body iterates
  # over each result and fails the aggregator if any non-skipped job
  # came back as anything other than "success".
  #
  # Why this exists (vs. listing every job individually in branch
  # protection): when CI grows or shrinks, only this `needs:` list and
  # the `check_result` block below need editing. The required-status
  # check in branch protection stays pointed at `tests_pass` forever,
  # so PRs don't get stuck on stale required-check names after a
  # workflow refactor. `if: ${{ !cancelled() }}` ensures the aggregator
  # still reports even when upstream jobs fail, so the merge gate can see
  # the red, while a run canceled by a newer push reports canceled rather
  # than failure.
  #
  # `security_audit` is INCLUDED in the gate (since 2026-05-27). Its
  # warn-vs-deny graduation lives in deny.toml, not in CI flags, so
  # a green job means "no unignored advisories, all licenses
  # allow-listed, all sources accepted" - which is exactly what we
  # want to enforce.
  tests_pass:
    name: tests_pass
    needs:
      - orchestrate
      - check_style
      - run_tests_linux
      - perf_gates
      - security_audit
      - workflow_audit
      - macos_check
      - macos_render_smoke
      - windows_check
      - windows_render_smoke
      - linux_aarch64_check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Aggregate upstream results
        env:
          RESULT_ORCHESTRATE: ${{ needs.orchestrate.result }}
          RESULT_CHECK_STYLE: ${{ needs.check_style.result }}
          RESULT_RUN_TESTS_LINUX: ${{ needs.run_tests_linux.result }}
          RESULT_PERF_GATES: ${{ needs.perf_gates.result }}
          RESULT_SECURITY_AUDIT: ${{ needs.security_audit.result }}
          RESULT_WORKFLOW_AUDIT: ${{ needs.workflow_audit.result }}
          RESULT_MACOS_CHECK: ${{ needs.macos_check.result }}
          RESULT_MACOS_RENDER_SMOKE: ${{ needs.macos_render_smoke.result }}
          RESULT_WINDOWS_CHECK: ${{ needs.windows_check.result }}
          RESULT_WINDOWS_RENDER_SMOKE: ${{ needs.windows_render_smoke.result }}
          RESULT_LINUX_AARCH64_CHECK: ${{ needs.linux_aarch64_check.result }}
        run: |
          EXIT_CODE=0

          check_result() {
            echo "* $1: $2"
            if [[ "$2" != "skipped" && "$2" != "success" ]]; then
              EXIT_CODE=1
            fi
          }

          check_result "orchestrate"          "$RESULT_ORCHESTRATE"
          check_result "check_style"          "$RESULT_CHECK_STYLE"
          check_result "run_tests_linux"      "$RESULT_RUN_TESTS_LINUX"
          check_result "perf_gates"           "$RESULT_PERF_GATES"
          check_result "security_audit"       "$RESULT_SECURITY_AUDIT"
          check_result "workflow_audit"       "$RESULT_WORKFLOW_AUDIT"
          check_result "macos_check"          "$RESULT_MACOS_CHECK"
          check_result "macos_render_smoke"   "$RESULT_MACOS_RENDER_SMOKE"
          check_result "windows_check"        "$RESULT_WINDOWS_CHECK"
          check_result "windows_render_smoke" "$RESULT_WINDOWS_RENDER_SMOKE"
          check_result "linux_aarch64_check"  "$RESULT_LINUX_AARCH64_CHECK"

          exit $EXIT_CODE

name: release

# The orchestrator of a release. `preflight` resolves the commit once,
# `ci-verdict` requires `run_tests` green on it, one reusable workflow per
# platform builds, signs and smokes its own artifacts, the Linux packages are
# installed on five distributions, and the last job publishes. Every step
# calls a script: docs/release/runbook.md, "Release scripts", lists them.
on:
  push:
    tags: ["v*"]
  # A dispatch is a dry-run. It builds the whole matrix and publishes
  # nothing: the publish job runs on a tag push only, and `update_cask.yml`
  # and `repo_publish.yml` ignore a release run that a push did not start.
  # Its artifacts stay 7 days, listed with their SHA-256 in the run summary.
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run semver (no v prefix, e.g. 0.2.12-rc.1)"
        required: true
        type: string
      target_ref:
        description: "Git ref to build from"
        required: false
        type: string
        default: main
      msi_upgrade_version:
        description: "Optional x.y.z MSI ProductVersion used only by a dry-run upgrade smoke"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# A release builds from a clean state and never touches the Actions cache: a
# tag-scoped entry serves only a re-run of that tag and evicts an entry
# `run_tests` restores on `main`. The setting applies to the called workflows.
cache-mode: none

# One release at a time, never cancelled. `queue: max` keeps every waiting
# run, so two tags pushed a minute apart both publish, in the order pushed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

# Never -x: xtrace writes secrets into the public log, and
# scripts/check-workflows.sh rejects it.
defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  # `v<version>`: the pushed tag, or the version a dry-run was dispatched
  # with, so asset names are the same in both modes.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  # A dry-run may exercise an upgrade while the source still reports the
  # released version: the override changes only the unpublished MSI.
  WINDOWS_MSI_VERSION: ${{ github.event_name == 'workflow_dispatch' && (inputs.msi_upgrade_version || inputs.version) || github.ref_name }}
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || 'release' }}
  # Signing secrets live in the `release` environment, whose deployment
  # policy admits only `main` and `v*` tags and checks the ref the run was
  # started from, not the `target_ref` it builds. So a run signs on a tag
  # push, or on a dispatch from `main` that also builds `main`. Any other
  # run uses no environment, gets no secret and builds unsigned artifacts.
  SIGNED: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.ref == 'refs/heads/main' && (inputs.target_ref || 'main') == 'main') }}

jobs:
  # The commit this run builds is resolved once, here, and every other
  # checkout uses `needs.preflight.outputs.sha`: a tag re-created or a push
  # to `main` mid-run can no longer mix two commits in one release. The
  # checkout below is the workflow's own commit (the tag's commit on a tag
  # push), which only supplies the script. Every input and version invariant
  # is checked here, in seconds, instead of 38 minutes into the MSI smoke.
  preflight:
    name: Resolve the release commit and check its inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ env.RELEASE_TAG }}
      mode: ${{ env.RELEASE_MODE }}
      msi_version: ${{ env.WINDOWS_MSI_VERSION }}
      signed: ${{ env.SIGNED }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: scripts

      - name: Resolve the commit and check tag, version and MSI inputs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          TARGET_REF: ${{ inputs.target_ref }}
          VERSION: ${{ inputs.version }}
          MSI_UPGRADE_VERSION: ${{ inputs.msi_upgrade_version }}
          MSI_SMOKES: ${{ env.SIGNED }}
        run: scripts/release-preflight.sh

      # Every build leg bakes the embedded update key into the binary, and a
      # keyless build refuses every future update. Only the `_NEXT` rotation
      # slot may be empty.
      - name: Verify minisign public keys
        env:
          PANEFLOW_MINISIGN_PUBKEY: ${{ vars.PANEFLOW_MINISIGN_PUBKEY }}
          PANEFLOW_MINISIGN_PUBKEY_NEXT: ${{ vars.PANEFLOW_MINISIGN_PUBKEY_NEXT }}
        run: scripts/check-minisign-pubkeys.sh

      # The package smokes run in bare distribution containers with no
      # checkout. They download this artifact: the smoke script, and the retry
      # wrapper it runs its apt, dnf and zypper calls through, which retries a
      # transient mirror failure and fails at once on anything else.
      - name: Upload the package smoke scripts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ci-scripts
          path: |
            scripts/ci-retry-network.sh
            scripts/smoke-linux-package.sh
          if-no-files-found: error
          retention-days: 7

  # fmt, clippy --all-targets and the tests of all four platforms already ran
  # in `run_tests` on this exact commit. This job reads that verdict instead of
  # re-running a Linux-only subset, in parallel with the builds, and the
  # publish job needs it. It waits for a `run_tests` still in progress, and
  # names the job and the command to re-run when one is red or skipped.
  ci-verdict:
    name: run_tests verdict on the release commit
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: |
            .github/workflows
            scripts

      - name: Require every run_tests job to be success
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          RESUME_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_ref || 'main') || github.ref_name }}
        run: scripts/require-ci-verdict.sh "$RELEASE_SHA" "$RESUME_REF"

  # One reusable workflow per platform. Each receives only the secrets of its
  # platform, by name, and declares its own permissions and timeouts. "Re-run
  # failed jobs" re-runs only the platform that failed. A leg that fails
  # blocks the publish job, which needs all three.
  linux:
    name: Linux
    needs: preflight
    uses: ./.github/workflows/release-linux.yml
    with:
      sha: ${{ needs.preflight.outputs.sha }}
      tag: ${{ needs.preflight.outputs.tag }}
      mode: ${{ needs.preflight.outputs.mode }}
      signed: ${{ needs.preflight.outputs.signed == 'true' }}
    secrets:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

  macos:
    name: macOS
    needs: preflight
    uses: ./.github/workflows/release-macos.yml
    with:
      sha: ${{ needs.preflight.outputs.sha }}
      tag: ${{ needs.preflight.outputs.tag }}
      mode: ${{ needs.preflight.outputs.mode }}
      signed: ${{ needs.preflight.outputs.signed == 'true' }}
    secrets:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
      APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  windows:
    name: Windows
    needs: preflight
    uses: ./.github/workflows/release-windows.yml
    with:
      sha: ${{ needs.preflight.outputs.sha }}
      tag: ${{ needs.preflight.outputs.tag }}
      mode: ${{ needs.preflight.outputs.mode }}
      msi_version: ${{ needs.preflight.outputs.msi_version }}
      signed: ${{ needs.preflight.outputs.signed == 'true' }}
    secrets:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}

  # Each leg installs the x86_64 package the way its distribution does, in a
  # bare container, through `scripts/smoke-linux-package.sh`. Ubuntu 22.04
  # is the glibc 2.35 floor: its leg runs `paneflow --version`. Arch
  # installs the tarball, there is no PKGBUILD. `fail-fast: false` keeps
  # every distribution's verdict, and the publish job needs the matrix.
  smoke-linux:
    name: Smoke test - ${{ matrix.name }}
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            name: Ubuntu 22.04 (.deb postinst)
            image: ubuntu:22.04
          - distro: fedora
            name: Fedora 40 (.rpm postinst)
            image: fedora:40
          - distro: debian
            name: Debian 12 (.deb postinst)
            image: debian:bookworm-slim
          - distro: opensuse
            name: openSUSE Tumbleweed (.rpm postinst)
            image: opensuse/tumbleweed
          - distro: arch
            name: Arch Linux (tar.gz binary, no native PKGBUILD)
            image: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the package smoke scripts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ci-scripts
          path: ./ci-scripts

      - name: Download the built Linux x86_64 packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-x86_64-Linux
          path: ./release-assets

      - name: Install the package and check what it wrote
        env:
          DISTRO: ${{ matrix.distro }}
          TAG: ${{ env.RELEASE_TAG }}
        run: bash ci-scripts/smoke-linux-package.sh "$DISTRO" "${TAG#v}" release-assets

  dry-run-summary:
    name: Dry-run artifact summary
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all release-assets-* workflow artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Render artifact + SHA-256 table to job summary
        env:
          DRYRUN_TAG: ${{ env.RELEASE_TAG }}
          DRYRUN_REF: ${{ inputs.target_ref || 'main' }} at ${{ needs.preflight.outputs.sha }}
        run: scripts/release-dry-run-summary.sh "$DRYRUN_TAG" "$DRYRUN_REF" release-assets

  # The only job that writes: it runs on a tag push, after the verdict, the
  # three platforms with their MSI and auto-update gates, and the package
  # smokes. It uploads to a draft, compares every digest GitHub computed
  # with the built file, attests the assets, then publishes: a published
  # release is immutable, so nothing is ever replaced afterwards. The tag
  # must still point at the built commit before anything is uploaded.
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, ci-verdict, linux, macos, windows, smoke-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Require the tag to still point at the built commit
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: scripts/require-tag-at-commit.sh "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Refuse a release that is already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/require-unpublished-release.sh "$RELEASE_TAG"

      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Verify merged release artifacts
        run: |
          set -euo pipefail
          if [ ! -d release-assets ] || ! find release-assets -maxdepth 1 -type f | grep -q .; then
            echo "::error::No release artifacts were downloaded. Refusing to create an empty GitHub Release."
            exit 1
          fi

      - name: Sign release artifacts (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: scripts/sign-release-assets.sh release-assets

      - name: Create the draft GitHub Release and upload the assets
        id: draft
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}

      - name: Compare every uploaded asset digest with the built file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: bash scripts/verify-release-digests.sh "$RELEASE_ID" release-assets

      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Publish the verified and attested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false

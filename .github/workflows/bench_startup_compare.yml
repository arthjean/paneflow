name: Startup comparison (Paneflow vs cmux)

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed launches per app
        default: "10"
      cmux_version:
        description: cmux release to download, without the v (empty = latest)
        default: ""

permissions:
  contents: read

jobs:
  compare:
    name: macOS aarch64 startup comparison
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-libghostty
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: "v1-rust"
          key: aarch64-apple-darwin
      - name: Run the comparison
        env:
          CMUX_VERSION: ${{ inputs.cmux_version || '' }}
          RUNS: ${{ inputs.runs || '10' }}
        run: |
          set -euo pipefail
          scripts/bench-startup-compare.sh --runs "$RUNS" | tee bench-startup-compare.log
          {
            echo "## Startup comparison (GitHub macos-14 runner, virtualized GPU)"
            echo
            sed -n '/PANEFLOW_BENCH_TABLE_BEGIN/,/PANEFLOW_BENCH_TABLE_END/p' bench-startup-compare.log | sed '1d;$d'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-compare
          path: |
            bench/results/startup-compare-*.json
            bench-startup-compare.log

name: libghostty Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  GHOSTTY_SHA: f2d5758f6305867dc36b36293c6165d8152b853e
  ZIG_VERSION: 0.16.0
  TARGET: x86_64-pc-windows-msvc
  NATIVE_PROFILE: ReleaseFast-simd-fixedbase-seed0-j1

jobs:
  # Gating lives here, at job level, not in a `paths:` filter on the trigger.
  # A workflow that a trigger-level `paths:` filtered out reports no status at
  # all, which leaves a required status check pending forever and blocks the
  # PR. This job always runs, always reports, and costs seconds; the expensive
  # lanes below read its output. Same pattern as `run_tests.yml::orchestrate`.
  changes:
    name: Detect libghostty inputs
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            native:
              - '.github/workflows/libghostty-windows.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/run_tests.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/paneflow-ghostty-smoke/**'
              - 'crates/paneflow-libghostty-sys/**'
              - 'crates/paneflow-terminal-ghostty/**'
              - 'native/libghostty/**'
              - 'packaging/wix/**'
              - 'scripts/*libghostty*'
              - 'src-app/Cargo.toml'
              - 'src-app/src/terminal/**'

  native-rebuild:
    name: Rebuild pinned native archive
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Checkout pinned Ghostty source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ghostty-org/ghostty
          ref: ${{ env.GHOSTTY_SHA }}
          path: .ghostty-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify workflow pins match the manifest
        run: |
          $ManifestPath = Join-Path $PWD 'native\libghostty\manifest.toml'
          . (Join-Path $PWD 'scripts\libghostty-manifest.ps1')
          foreach ($pin in @(
            @{ Key = 'source_sha'; Value = $env:GHOSTTY_SHA },
            @{ Key = 'zig_version'; Value = $env:ZIG_VERSION }
          )) {
            $actual = Get-ManifestString $pin.Key
            if ($actual -ne $pin.Value) {
              throw "workflow pin $($pin.Key) is '$($pin.Value)' but the manifest says '$actual'"
            }
          }
          Write-Host 'workflow pins match native/libghostty/manifest.toml'

      - name: Install manifest-pinned Zig distribution
        run: |
          $ManifestPath = Join-Path $PWD 'native\libghostty\manifest.toml'
          . (Join-Path $PWD 'scripts\libghostty-manifest.ps1')

          $archiveUrl = Get-ManifestString 'windows_zig_archive_url'
          $expectedArchiveSha = Get-ManifestString 'windows_zig_archive_sha256'
          $sourceArchiveUrl = Get-ManifestString 'windows_zig_source_archive_url'
          $expectedSourceArchiveSha = Get-ManifestString 'windows_zig_source_archive_sha256'
          $toolRoot = Join-Path $env:RUNNER_TEMP "paneflow-zig-$env:ZIG_VERSION"
          $archive = "$toolRoot.zip"
          $sourceArchive = "$toolRoot-source.tar.xz"
          if ((Test-Path -LiteralPath $toolRoot) -or
              (Test-Path -LiteralPath $archive) -or
              (Test-Path -LiteralPath $sourceArchive)) {
            throw "refusing to replace an existing Zig tool path: $toolRoot"
          }
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archive
          $actualArchiveSha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualArchiveSha -ne $expectedArchiveSha) {
            throw "Zig distribution checksum mismatch: expected $expectedArchiveSha, got $actualArchiveSha"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $zig = Join-Path $toolRoot "zig-x86_64-windows-$env:ZIG_VERSION\zig.exe"
          if (-not (Test-Path -LiteralPath $zig -PathType Leaf)) {
            throw "Zig distribution did not contain the expected executable: $zig"
          }
          Invoke-WebRequest -Uri $sourceArchiveUrl -OutFile $sourceArchive
          $actualSourceArchiveSha = (Get-FileHash -LiteralPath $sourceArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSourceArchiveSha -ne $expectedSourceArchiveSha) {
            throw "Zig source archive checksum mismatch: expected $expectedSourceArchiveSha, got $actualSourceArchiveSha"
          }
          "PANEFLOW_ZIG=$zig" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "PANEFLOW_ZIG_SOURCE_ARCHIVE=$sourceArchive" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install manifest-pinned MSVC toolset and Windows SDK
        env:
          MSVC_COMPONENT: Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64
          WINDOWS_SDK_COMPONENT: Microsoft.VisualStudio.Component.Windows11SDK.26100
          LLVM_COMPONENT: Microsoft.VisualStudio.Component.VC.Llvm.Clang
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          $setup = Join-Path $installerRoot 'setup.exe'
          $installationPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'Visual Studio 2022 is not installed on the runner.'
          }

          $requiredComponents = @($env:MSVC_COMPONENT, $env:WINDOWS_SDK_COMPONENT, $env:LLVM_COMPONENT)
          $missingComponents = @(
            foreach ($component in $requiredComponents) {
              $installedAt = (& $vswhere -latest -products * -requires $component -property installationPath | Select-Object -First 1)
              if ([string]::IsNullOrWhiteSpace($installedAt)) {
                $component
              }
            }
          )

          if ($missingComponents.Count -gt 0) {
            if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
              throw "Visual Studio Installer was not found at $setup."
            }

            $arguments = @(
              'modify',
              '--installPath', "`"$installationPath`"",
              '--quiet',
              '--norestart'
            )
            foreach ($component in $missingComponents) {
              $arguments += @('--add', $component)
            }

            Write-Host "Installing Visual Studio components: $($missingComponents -join ', ')"
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio Installer exited with code $($process.ExitCode)."
            }
          }

          $msvcPath = Join-Path $installationPath 'VC\Tools\MSVC\14.38.33130'
          $sdkPath = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib\10.0.26100.0'
          if (-not (Test-Path -LiteralPath $msvcPath -PathType Container)) {
            throw "The manifest-pinned MSVC toolset was not found at $msvcPath."
          }
          if (-not (Test-Path -LiteralPath $sdkPath -PathType Container)) {
            throw "The manifest-pinned Windows SDK was not found at $sdkPath."
          }

          # The archive normalization recipe is LLVM-version-sensitive, and the
          # build script hard-fails on any other version. Surface that as a
          # labelled preflight failure rather than an opaque llvm-objcopy error
          # 40 minutes into the rebuild.
          $ManifestPath = Join-Path $PWD 'native\libghostty\manifest.toml'
          . (Join-Path $PWD 'scripts\libghostty-manifest.ps1')
          $expectedLlvm = Get-ManifestString 'windows_llvm_version'
          $llvmObjcopy = Join-Path $installationPath 'VC\Tools\Llvm\x64\bin\llvm-objcopy.exe'
          if (-not (Test-Path -LiteralPath $llvmObjcopy -PathType Leaf)) {
            throw "The LLVM normalization tools were not found at $llvmObjcopy."
          }
          $llvmVersion = @(& $llvmObjcopy --version)
          if ($LASTEXITCODE -ne 0 -or -not ($llvmVersion -match "LLVM version $([regex]::Escape($expectedLlvm))")) {
            throw "libghostty requires LLVM normalization tools $expectedLlvm; this runner carries: $($llvmVersion -join ' ')"
          }
          Write-Host "LLVM normalization tools: $expectedLlvm at $llvmObjcopy"

      # The rebuild deliberately has no native object cache. The canonical
      # source/cache paths are part of the reproducibility contract, and the
      # script performs six independent clean builds before publication.
      - name: Rebuild and compare six canonical archives
        env:
          PANEFLOW_GHOSTTY_SOURCE_DIR: ${{ github.workspace }}\.ghostty-source
          EVIDENCE_DIR: ${{ runner.temp }}\libghostty-native-evidence
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null

          # Same narrow retry as scripts/ci-retry-network.sh on the Unix lanes.
          # Zig fetches the 16 build.zig.zon dependencies from two hosts on
          # every clean build, six times across three reproducibility passes,
          # with no cache.
          # Only a transport failure is retried; an archive hash mismatch or a
          # reproducibility divergence still fails on the first attempt.
          $transient = 'unable to connect to server|TemporaryNameServerFailure|UnknownHostName|' +
            'HostLacksNetworkAddresses|NameServerFailure|ConnectionRefused|ConnectionResetByPeer|' +
            'ConnectionTimedOut|NetworkUnreachable|TlsInitializationFailed|unexpected EOF|' +
            'TemporaryFailure|error: unable to fetch|502 Bad Gateway|503 Service Unavailable'
          $canonicalLog = Join-Path $env:EVIDENCE_DIR 'native-rebuild.log'
          $attempts = 3

          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            $log = Join-Path $env:EVIDENCE_DIR "native-rebuild-attempt-$attempt.log"
            Write-Host "native rebuild attempt $attempt/$attempts"
            $failure = $null
            # Reset first: `$LASTEXITCODE` can otherwise carry a stale value
            # from an unrelated native command earlier in the job.
            $global:LASTEXITCODE = 0
            try {
              for ($reproPass = 1; $reproPass -le 3; $reproPass++) {
                Write-Host "reproducibility pass $reproPass/3"
                $passEvidence = Join-Path $env:EVIDENCE_DIR "reproducibility-pass-$reproPass"
                & ./scripts/build-libghostty-windows.ps1 `
                  -SourceDir $env:PANEFLOW_GHOSTTY_SOURCE_DIR `
                  -Zig $env:PANEFLOW_ZIG `
                  -OutputDir "target\libghostty\$env:TARGET" `
                  -EvidenceDir $passEvidence `
                  -VerifyReproducible *>&1 | Tee-Object -FilePath $log -Append
                if ($LASTEXITCODE -ne 0) {
                  $failure = "reproducibility pass $reproPass exited with code $LASTEXITCODE"
                  break
                }
              }
            }
            catch {
              $failure = $_.Exception.Message
            }

            Copy-Item -LiteralPath $log -Destination $canonicalLog -Force -ErrorAction SilentlyContinue

            if (-not $failure) {
              if ($attempt -gt 1) {
                Write-Host "succeeded on attempt $attempt after a transient network failure"
              }
              break
            }

            $output = if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Raw } else { '' }
            if (-not (($output -match $transient) -or ($failure -match $transient))) {
              throw "native rebuild failed with no transient network signature: $failure"
            }
            if ($attempt -eq $attempts) {
              throw "native rebuild still failing on a transient network error after $attempts attempts: $failure"
            }
            $delay = $attempt * 20
            Write-Warning "transient network failure ($failure); retrying in ${delay}s"
            Start-Sleep -Seconds $delay
          }

      - name: Verify repository consumer inputs and publish provenance
        env:
          EVIDENCE_DIR: ${{ runner.temp }}\libghostty-native-evidence
        run: |
          $prepared = "target\libghostty\$env:TARGET"
          $ManifestPath = Join-Path $PWD 'native\libghostty\manifest.toml'
          . (Join-Path $PWD 'scripts\libghostty-manifest.ps1')
          $archiveRelativePath = Get-ManifestTargetString $env:TARGET 'archive_path'
          $archivePath = Join-Path $prepared $archiveRelativePath
          $report = Join-Path $env:EVIDENCE_DIR 'repository-provenance.json'
          & ./scripts/verify-libghostty-windows.ps1 -ReportPath $report
          $repositoryProvenance = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json

          Copy-Item -LiteralPath 'native\libghostty\manifest.toml' -Destination $env:EVIDENCE_DIR
          Copy-Item -LiteralPath 'native\libghostty\THIRD_PARTY_NOTICES.md' -Destination $env:EVIDENCE_DIR
          Copy-Item -LiteralPath 'native\libghostty\sbom.cdx.json' -Destination $env:EVIDENCE_DIR
          Copy-Item -LiteralPath '.ghostty-source\build.zig.zon' -Destination $env:EVIDENCE_DIR

          $native = [ordered]@{
            schema_version = 1
            commit = $env:GITHUB_SHA
            source_sha = $env:GHOSTTY_SHA
            zig_version = $env:ZIG_VERSION
            zig_codegen = $repositoryProvenance.zig_codegen
            target = $env:TARGET
            profile = $env:NATIVE_PROFILE
            archive_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
            build_info_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath "$prepared\build-info.txt").Hash.ToLowerInvariant()
            symbols_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath "$prepared\symbols.txt").Hash.ToLowerInvariant()
            headers_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath "$prepared\headers.sha256").Hash.ToLowerInvariant()
            source_manifest_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath '.ghostty-source\build.zig.zon').Hash.ToLowerInvariant()
          }
          $native | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:EVIDENCE_DIR 'native-provenance.json') -Encoding utf8

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libghostty-windows-native-${{ github.sha }}
          path: |
            target/libghostty/x86_64-pc-windows-msvc
            ${{ runner.temp }}/libghostty-native-evidence
          if-no-files-found: error
          retention-days: 30

  consumer-qualification:
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    name: Repository consumer and release budgets
    # Windows Server 2022 build 20348 carries microsoft/terminal#8706:
    # ClosePseudoConsole leaks its internal OpenConsole process handle once per
    # session. Run resource gates on the build-26100 ConPTY line so they measure
    # Paneflow ownership; supported Windows 10/11 remain in the manual matrix.
    runs-on: windows-2025
    # Was 120 for fmt + clippy --all-targets + test + qualification. Only the
    # qualification build is left.
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.96.1"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: v1-libghostty-windows-consumer
          key: ${{ env.TARGET }}-${{ env.GHOSTTY_SHA }}-${{ env.ZIG_VERSION }}-${{ env.NATIVE_PROFILE }}-${{ hashFiles('Cargo.lock', 'native/libghostty/manifest.toml') }}

      # fmt, clippy --all-targets and `cargo test` used to run here. They are
      # what `run_tests.yml::windows_check` runs on every commit against the
      # same committed archive, and it now passes `--all-targets` too, so this
      # was a second Windows runner producing the same answer. What is left is
      # the part only this lane can do: qualification on the build-26100
      # ConPTY line.
      - name: Qualify repository artifact on the controlled runner
        env:
          QUALIFICATION_DIR: ${{ runner.temp }}\libghostty-windows-qualification
        run: |
          Remove-Item Env:PANEFLOW_LIBGHOSTTY_DIR -ErrorAction SilentlyContinue
          & ./scripts/qualify-libghostty-windows.ps1 -OutputDir $env:QUALIFICATION_DIR

      - name: Upload commit-scoped qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libghostty-windows-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/libghostty-windows-qualification
          if-no-files-found: error
          retention-days: 30

  validation-summary:
    name: libghostty Windows validation
    if: always()
    needs: [changes, native-rebuild, consumer-qualification]
    runs-on: ubuntu-22.04
    steps:
      - name: Require native and consumer lanes
        env:
          # Fail-closed in both directions: when a libghostty input changed,
          # both lanes must be green; when none did, both must have actually
          # skipped. `skipped` is never silently accepted.
          EXPECTED_TO_RUN: ${{ needs.changes.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          NATIVE: ${{ needs.native-rebuild.result }}
          CONSUMER: ${{ needs.consumer-qualification.result }}
        run: |
          if [ "$EXPECTED_TO_RUN" = true ]; then
            want=success
            note="All automated libghostty Windows checks passed."
          else
            want=skipped
            note="No libghostty input changed; both lanes correctly skipped."
          fi
          status=0
          for lane in "native-rebuild:$NATIVE" "consumer-qualification:$CONSUMER"; do
            name="${lane%%:*}"
            result="${lane#*:}"
            if [ "$result" != "$want" ]; then
              echo "::error::$name reported '$result', expected '$want'"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          echo "$note"

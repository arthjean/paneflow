# US-027 (cli-hardening-followup-2026-Q3): daily cargo-deny scan
# that opens a GitHub issue when the lockfile gains a new advisory
# overnight. Complements the PR-gate `security_audit` job in
# `run_tests.yml` (BLOCKING since 2026-05-27 per the precedent
# `prd-agents-hardening-2026-Q3`); together they form the two-layer
# defense the precedent PRD designed:
#
#   * `run_tests.yml::security_audit` - PR gate. Catches NEW
#     advisories introduced by a Cargo.lock change.
#   * `audit.yml` (this file) - daily cron. Catches NEW advisories
#     against the SAME Cargo.lock when the RustSec database itself
#     grows (a previously-clean dep is later flagged). It audits both
#     `main` and the latest published release, and files every alert
#     under the existing `type: security` label; a filing failure fails
#     the job. A second job alerts 60 days before the apt and rpm
#     signing key in `packaging/paneflow-release.asc` expires.
#
# Both share `deny.toml` so the per-advisory rationale list lives in
# a single source of truth.
#
# Security: every `${{ }}` interpolation lives in an `env:` block
# and is referenced via `$VAR` inside `run:` shell to avoid the
# workflow-injection class flagged in
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/.
# Even though `github.repository` / `github.run_id` are GitHub-
# controlled (not user input), the env-indirection is enforced for
# every interpolation for grep-friendly consistency.

name: Daily Security Audit

on:
  schedule:
    # 04:17 UTC daily. Slightly off the hour to spread CI load
    # against other public OSS projects that converge on :00 / :30.
    - cron: "17 4 * * *"
  # Also run on workflow_dispatch so a maintainer can re-trigger
  # after editing deny.toml without waiting for the next cron tick.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  cron_audit:
    name: cargo-deny check (cron, ${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # `main` catches an advisory against the lockfile we develop on, the
    # latest published release catches one against what users run. Advisory
    # titles depend only on the advisory ID, so both legs feed one issue; the
    # legs run one after the other so they never both create it.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [main, latest-release]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Resolve the audited ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = latest-release ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "::error::the latest release tag '$tag' is not a vX.Y.Z tag"
              exit 1
            fi
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "label=latest release $tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/heads/main" >> "$GITHUB_OUTPUT"
            echo "label=main" >> "$GITHUB_OUTPUT"
          fi

      # The audited tree is checked out beside the workflow's own checkout, so
      # the alerting scripts always come from the current commit even when the
      # audited release predates them.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.ref }}
          path: audited

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"

      # The same release binary, version and SHA-256 as the PR gate
      # (run_tests.yml::security_audit): both run this script, so the cron
      # and the gate can never disagree about the same lockfile.
      - name: Install cargo-deny (prebuilt, pinned digest)
        run: scripts/install-cargo-deny.sh

      # Only the network fetches are retried, and only on a transient network
      # signature. The check below runs offline and is never retried, so a
      # real advisory fails once, immediately.
      - name: Fetch crates and the advisory database
        working-directory: audited
        run: |
          set -euo pipefail
          ../scripts/ci-retry-network.sh cargo fetch --locked
          ../scripts/ci-retry-network.sh cargo deny fetch db

      - name: cargo deny check advisories
        id: deny
        working-directory: audited
        env:
          CARGO_TERM_COLOR: never
        # The cron job ONLY scans advisories -- license + sources
        # gates already run on every PR via run_tests.yml. Scoping
        # the cron to advisories keeps the cron's blast radius
        # tight: license-allow-list churn does not auto-file an
        # issue, only a real new CVE / unmaintained mark does.
        run: |
          set -euo pipefail
          if ! cargo deny --frozen check --disable-fetch advisories 2>&1 | tee ../deny-output.txt; then
            echo "deny_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deny_failed=false" >> "$GITHUB_OUTPUT"

      - name: Open or comment the advisory issue
        if: steps.deny.outputs.deny_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          AUDITED: ${{ steps.ref.outputs.label }}
        run: |
          set -euo pipefail
          NOW_UTC=$(date -u +"%Y-%m-%d %H:%M UTC")
          ADVISORIES=$(awk '
            /^error\[/ { in_error = 1; next }
            /^(warning|note|help)\[/ { in_error = 0; next }
            in_error { while (match($0, /RUSTSEC-[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]/)) { print substr($0, RSTART, RLENGTH); $0 = substr($0, RSTART + RLENGTH) } }
          ' deny-output.txt | sort -u)
          if [ -z "${ADVISORIES}" ]; then
            TITLES=("Security: cargo-deny advisories check failed")
          else
            TITLES=()
            while IFS= read -r advisory; do
              TITLES+=("Security: cargo-deny advisory ${advisory}")
            done <<< "${ADVISORIES}"
          fi

          {
            echo "Daily \`cargo-deny\` cron flagged an advisory against the \`Cargo.lock\` of **${AUDITED}**."
            echo
            echo "## Output"
            echo
            echo '```'
            cat deny-output.txt
            echo '```'
            echo
            echo "## Triage"
            echo
            echo "1. Check the linked advisory at https://rustsec.org/advisories/."
            echo "2. If a fixed upgrade exists, bump the dep and verify locally."
            echo "3. If only the latest release is flagged, \`main\` already has the fix:"
            echo "   cut a release so users receive it."
            echo "4. If no fixed upgrade exists but the code path is unreachable"
            echo "   from Paneflow, add the advisory ID to \`deny.toml\`'s"
            echo "   \`[advisories].ignore\` list with a rationale matching the"
            echo "   pattern of the existing \`RUSTSEC-2023-0071\` entry."
            echo
            echo "## Workflow"
            echo
            echo "- File: \`.github/workflows/audit.yml\`"
            echo "- Run: https://github.com/${REPO_SLUG}/actions/runs/${RUN_ID}"
          } > issue-body.md

          status=0
          for TITLE in "${TITLES[@]}"; do
            bash scripts/file-security-alert.sh "${TITLE}" issue-body.md \
              "Still flagged by the cron at ${NOW_UTC} on **${AUDITED}**. See run https://github.com/${REPO_SLUG}/actions/runs/${RUN_ID}." \
              || status=1
          done
          exit "$status"

      - name: Final status
        if: ${{ !cancelled() && steps.deny.outputs.deny_failed == 'true' }}
        env:
          AUDITED: ${{ steps.ref.outputs.label }}
        run: |
          echo "::error::cargo-deny check failed on ${AUDITED} -- see the security issue and Cargo.lock for the offending advisory."
          exit 1

  signing_key_expiry:
    name: Repository signing key expiry
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Check the apt and rpm signing key expiry
        id: key
        run: bash scripts/check-signing-key-expiry.sh packaging/paneflow-release.asc 60

      - name: Open or comment the key expiry issue
        if: failure() && steps.key.outputs.expires != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EXPIRES: ${{ steps.key.outputs.expires }}
          DAYS_LEFT: ${{ steps.key.outputs.days_left }}
        run: |
          set -euo pipefail
          {
            echo "The apt and rpm repository signing key (\`packaging/paneflow-release.asc\`) expires on **${EXPIRES}**, in ${DAYS_LEFT} days."
            echo
            echo "Once it expires, \`apt update\` and \`dnf\` with \`repo_gpgcheck=1\` fail for every user."
            echo
            echo "## Triage"
            echo
            echo "1. Extend the key expiry, then update the \`GPG_PRIVATE_KEY\` secret and \`packaging/paneflow-release.asc\`."
            echo "2. Ship a release early enough that users receive the refreshed keyring through a package upgrade."
            echo
            echo "## Workflow"
            echo
            echo "- File: \`.github/workflows/audit.yml\`"
            echo "- Run: https://github.com/${REPO_SLUG}/actions/runs/${RUN_ID}"
          } > key-body.md
          bash scripts/file-security-alert.sh \
            "Security: repository signing key expires on ${EXPIRES}" \
            key-body.md \
            "Still expiring on ${EXPIRES} (${DAYS_LEFT} days left) at $(date -u +"%Y-%m-%d %H:%M UTC"). See run https://github.com/${REPO_SLUG}/actions/runs/${RUN_ID}."

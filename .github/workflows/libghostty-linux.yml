name: libghostty Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Same posture as run_tests.yml: -e fail-on-error, -u error-on-unset,
# -o pipefail propagate pipe failures. Several steps below build a path
# through `find ... -print -quit` and pipe it, which silently passed a
# missing artifact through before pipefail was on.
defaults:
  run:
    shell: bash -euo pipefail {0}

# The nightly gets a group of its own, so a push to main never cancels it.
concurrency:
  group: ${{ github.event_name == 'schedule' && format('{0}-schedule', github.workflow) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Gating lives here, at job level, not in a `paths:` filter on the trigger.
  # A workflow that a trigger-level `paths:` filtered out reports no status at
  # all, which leaves a required status check pending forever and blocks the
  # PR. This job always runs, always reports, and costs seconds; the expensive
  # lanes below read its output. Same pattern as `run_tests.yml::orchestrate`.
  changes:
    name: Detect libghostty inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `recipe` gates the engine lanes (reproducible rebuild, bindings, fuzz):
    # only the manifest, the build scripts, the -sys crate, this workflow and
    # the recipe workflow change what the engine build produces. `native`
    # gates the consumer lanes, which link the published archive.
    outputs:
      native: ${{ steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      recipe: ${{ steps.filter.outputs.recipe == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            native:
              - '.github/actions/fetch-libghostty/action.yml'
              - '.github/actions/libghostty-manifest/action.yml'
              - '.github/actions/linux-build-deps/action.yml'
              - '.github/workflows/libghostty-linux.yml'
              - '.github/workflows/release-linux.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'assets/icons/**'
              - 'assets/io.github.arthurdev44.paneflow.metainfo.xml'
              - 'assets/paneflow.desktop'
              - 'crates/paneflow-ghostty-smoke/**'
              - 'crates/paneflow-libghostty-sys/**'
              - 'crates/paneflow-terminal-ghostty/**'
              - 'debian/changelog'
              - 'fuzz/**'
              - 'native/libghostty/**'
              - 'packaging/AppRun'
              - 'packaging/debian/**'
              - 'packaging/paneflow-release.asc'
              - 'packaging/rpm/**'
              - 'scripts/*libghostty*'
              - 'scripts/bundle-appimage.sh'
              - 'scripts/bundle-tarball.sh'
              - 'src-app/Cargo.toml'
              - 'src-app/src/terminal/**'
              - 'src-app/tests/dependency_source_policy.rs'
            recipe:
              - '.github/actions/libghostty-manifest/action.yml'
              - '.github/workflows/libghostty-linux.yml'
              - '.github/workflows/libghostty-recipe.yml'
              - 'crates/paneflow-libghostty-sys/**'
              - 'native/libghostty/**'
              - 'scripts/*libghostty*'
              - 'scripts/install-minisign.sh'
              - 'scripts/install-zig.sh'

  # The reproducibility proof: two clean builds per Linux target, compared
  # with the manifest and with the published archive. It runs when the
  # recipe changed, on the nightly and on demand.
  recipe:
    name: Reproducible rebuild
    needs: changes
    if: needs.changes.outputs.recipe == 'true'
    uses: ./.github/workflows/libghostty-recipe.yml
    with:
      targets: linux

  native:
    name: Native, release, package (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    # Same Ubuntu 22.04 userland as the `build` job of `release-linux.yml`,
    # on a 24.04 host: `distro-smoke` installs these packages on Ubuntu 22.04
    # and Debian 12, where a binary linked against the host's glibc 2.39
    # would not start.
    container:
      image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
    # A release build against the published archive, and four package
    # formats. The engine rebuild is the `recipe` job above, in
    # `libghostty-recipe.yml`. The workspace tests and cargo-deny do not run
    # here: `run_tests.yml` runs them on both arches against the same
    # published archive, and `audit.yml` re-runs the advisory check daily.
    # The release build stays because the static-link check, the PTY stress
    # test, the four package formats and `distro-smoke` all consume it, and
    # no other job builds the Linux x86_64 release binary before a tag.
    timeout-minutes: 85
    steps:
      - name: Prepare the Ubuntu 22.04 build container
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates curl git sudo xz-utils

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/linux-build-deps
        with:
          container-toolchain: "true"
          extra-packages: >-
            appstream binutils elfutils icnsutils imagemagick patchelf rpm

      # This workflow keeps no rust-cache entry: the repository's cache quota
      # is reserved for the `run_tests.yml` jobs, which run on every push.
      - name: Install pinned packaging tools
        run: |
          cargo install cargo-deb --version 3.6.3 --locked
          cargo install cargo-generate-rpm --version 0.20.0 --locked

      # The consumer lanes link the published archive, exactly as
      # run_tests.yml and the release workflows do. The `recipe` job proves
      # that archive is the one the recipe produces.
      - uses: ./.github/actions/fetch-libghostty

      - name: Release candidate and package smoke binary
        run: |
          cargo build --release --locked \
            -p paneflow-app -p paneflow-host \
            --target "${{ matrix.target }}"
          cargo build --release --locked \
            -p paneflow-ghostty-smoke \
            --features native \
            --target "${{ matrix.target }}"
          "target/${{ matrix.target }}/release/paneflow-ghostty-smoke"

      - name: PTY resilience stress check
        if: >-
          matrix.arch == 'x86_64' &&
          (github.event_name == 'pull_request' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        run: |
          cargo test --release --locked \
            -p paneflow-app \
            --target "${{ matrix.target }}" \
            ghostty_spawn_resize_close_stress_has_no_residual_growth \
            -- --ignored --nocapture

      # The old 15 MiB gate measured this binary against a second, engine-less
      # build of the same commit. Ghostty is the only engine now, so there is
      # no second build to diff against and no absolute ceiling has been
      # measured for the whole application binary. What remains is the part
      # that still has a hard contract: libghostty must be statically linked
      # and its notices must ship.
      - name: Enforce static link and shipped notices
        run: |
          scripts/verify-libghostty-package.sh \
            --binary "target/${{ matrix.target }}/release/paneflow" \
            --notice native/libghostty/THIRD_PARTY_NOTICES.md

      - name: Build unsigned candidate packages
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          scripts/bundle-tarball.sh "$version"
          cargo deb --no-build -p paneflow-app --target "$TARGET"
          cargo generate-rpm -p src-app --target "$TARGET"
          scripts/bundle-appimage.sh "$version"

      - name: Verify notices in every candidate format
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Capture-then-grep via here-strings instead of a pipe, the same
          # way release.yml checks apt-cache policy. Under `set -o pipefail`,
          # `tar -tzf | grep -Fq` flakes with exit 2: grep closes its stdin
          # on the first match, tar takes EPIPE on its next write and reports
          # `tar: stdout: write error`, and pipefail turns that into a step
          # failure. Every listing here is multi-line, so all three have the
          # same surface. Observed on the aarch64 and x86_64 lanes.
          bundle=$(tar -tzf "$(find target/bundle -name '*.tar.gz' -print -quit)")
          grep -Fq 'paneflow.app/THIRD_PARTY_NOTICES.md' <<< "$bundle"
          deb=$(dpkg-deb -c "$(find "target/$TARGET/debian" -name '*.deb' -print -quit)")
          grep -Fq './usr/share/doc/paneflow/THIRD_PARTY_NOTICES.md' <<< "$deb"
          rpm_listing=$(rpm -qlp "$(find "target/$TARGET/generate-rpm" -name '*.rpm' -print -quit)")
          grep -Fq '/usr/share/doc/paneflow/THIRD_PARTY_NOTICES.md' <<< "$rpm_listing"
          appimage="$(find target/appimage -name '*.AppImage' -print -quit)"
          chmod +x "$appimage"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          (cd "$extract_dir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          test -f "$extract_dir/squashfs-root/usr/share/doc/paneflow/THIRD_PARTY_NOTICES.md"

      - name: Upload candidate packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libghostty-packages-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/paneflow-ghostty-smoke
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm
            target/bundle/*.tar.gz
            target/appimage/*.AppImage
          retention-days: 14

  bindings:
    name: Regenerated bindings and ABI
    needs: changes
    if: needs.changes.outputs.recipe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Read libghostty pins
        id: pins
        uses: ./.github/actions/libghostty-manifest
      - name: Checkout pinned Ghostty source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ghostty-org/ghostty
          ref: ${{ steps.pins.outputs.source_sha }}
          path: .ghostty-source
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
      - name: Install pinned bindgen and native tools
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && break
            echo "::warning::apt-get update failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] || { echo "::error::apt-get update failed 3 times"; exit 1; }
            sleep $((attempt * 10))
          done
          sudo apt-get install -y clang elfutils libclang-dev
          cargo install bindgen-cli --version 0.72.1 --locked --force
      - name: Regenerate and compare bindings
        env:
          PANEFLOW_GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/.ghostty-source
        run: scripts/generate-libghostty-bindings.sh
      # The native tests link the published archive that fetch-libghostty
      # places, with `PANEFLOW_LIBGHOSTTY_DIR` unset. `native` proves that
      # archive byte-identical to what the recipe produces, so a third Zig
      # build here would only reproduce the same bytes.
      - uses: ./.github/actions/fetch-libghostty
      - name: Run the native tests against the published archive
        run: cargo test --locked -p paneflow-terminal-ghostty --features native

  # Fuzzes the published archive that fetch-libghostty places, the one
  # `native` proves byte-identical to the recipe's output, so it starts with
  # the first wave of jobs instead of waiting for both rebuilds.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.recipe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 53
    strategy:
      fail-fast: false
      matrix:
        target: [parser, snapshot]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-07-14
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - uses: ./.github/actions/fetch-libghostty
      - name: Run bounded native fuzz target
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '60' }}
          RUSTUP_TOOLCHAIN: nightly-2026-07-14
        run: cargo fuzz run "${{ matrix.target }}" -- -max_total_time="$FUZZ_SECONDS"

  distro-smoke:
    name: Package smoke (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: native
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 11
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            arch: x86_64
            runs-on: ubuntu-24.04
            image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
            format: deb
          - distro: debian
            arch: x86_64
            runs-on: ubuntu-24.04
            image: debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
            format: deb
          - distro: fedora
            arch: x86_64
            runs-on: ubuntu-24.04
            image: registry.fedoraproject.org/fedora:44@sha256:e70db1fd517c7d6990715fb200b1aae95ef6a1ef1492dc12c8ca25cc129a5094
            format: rpm
          - distro: opensuse
            arch: x86_64
            runs-on: ubuntu-24.04
            # Tag rather than digest, unlike every other leg: Tumbleweed rolls
            # daily and its registry drops the superseded manifests, so a pin
            # turns this job red with "manifest unknown" within weeks. The smoke
            # test wants today's Tumbleweed anyway. Matches release.yml.
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            format: rpm
          - distro: arch
            arch: x86_64
            runs-on: ubuntu-24.04
            image: archlinux:base@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
            format: tar
          # The `native` job builds and uploads aarch64 .deb / .rpm / tarball /
          # AppImage on every run, and until now nothing ever installed them.
          # One leg per package format on a native ARM runner covers the
          # shipping aarch64 artifacts without doubling the whole matrix.
          - distro: debian
            arch: aarch64
            runs-on: ubuntu-24.04-arm
            image: debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
            format: deb
          - distro: fedora
            arch: aarch64
            runs-on: ubuntu-24.04-arm
            image: registry.fedoraproject.org/fedora:44@sha256:e70db1fd517c7d6990715fb200b1aae95ef6a1ef1492dc12c8ca25cc129a5094
            format: rpm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libghostty-packages-${{ matrix.arch }}
          path: candidate
      - name: Install candidate and inspection tools
        env:
          DISTRO: ${{ matrix.distro }}
          FORMAT: ${{ matrix.format }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          case "$FORMAT" in
            deb) packages=("$PWD"/candidate/**/*.deb) ;;
            rpm) packages=("$PWD"/candidate/**/*.rpm) ;;
            tar) packages=("$PWD"/candidate/**/*.tar.gz) ;;
            *) echo "unsupported package format: $FORMAT" >&2; exit 1 ;;
          esac
          if (( ${#packages[@]} != 1 )); then
            echo "expected exactly one $FORMAT package, found ${#packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          case "$DISTRO" in
            ubuntu|debian)
              apt-get update
              # Minimal Debian-family images exclude /usr/share/doc by default.
              apt-get -o "Dpkg::Options::=--path-include=/usr/share/doc/paneflow/*" \
                install -y --no-install-recommends binutils ca-certificates "$package"
              binary=/usr/bin/paneflow
              notice=/usr/share/doc/paneflow/THIRD_PARTY_NOTICES.md
              ;;
            fedora)
              # Clear the minimal image's nodocs transaction flag so regular
              # package documentation remains covered by this smoke test.
              dnf --setopt=tsflags= install -y binutils "$package"
              binary=/usr/bin/paneflow
              notice=/usr/share/doc/paneflow/THIRD_PARTY_NOTICES.md
              ;;
            opensuse)
              # download.opensuse.org and cdn.opensuse.org answer every repodata
              # and RPM request with a 302 to a nearby community mirror, and from
              # a US-hosted runner that mirror is regularly lagging or dead: both
              # 2026-09-03 failures burned 60 s connect timeouts on the 9 MB
              # appdata.xml.gz through all three retries, and a rerun on another
              # runner passed. libzypp downloads appdata unconditionally, so the
              # fix is the host: downloadcontentcdn.opensuse.org is the MirrorCache
              # origin behind Fastly and serves every file itself. The `:latest`
              # image's baked metadata still goes stale, so the forced refresh
              # stays, and the retry now only covers a publish in progress.
              sed -i 's#^baseurl=https\?://download\.opensuse\.org/#baseurl=https://downloadcontentcdn.opensuse.org/#' /etc/zypp/repos.d/*.repo
              grep -q 'downloadcontentcdn' /etc/zypp/repos.d/*.repo
              zypper --non-interactive repos --uri
              refreshed=0
              for attempt in 1 2 3; do
                if zypper --non-interactive --no-gpg-checks refresh --force; then
                  refreshed=1
                  break
                fi
                echo "::warning::zypper refresh failed (attempt $attempt/3)"
                sleep $((attempt * 20))
              done
              if [ "$refreshed" -ne 1 ]; then
                echo "::error::zypper could not refresh Tumbleweed metadata after 3 attempts"
                exit 1
              fi
              zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm binutils \
                "$package"
              binary=/usr/bin/paneflow
              notice=/usr/share/doc/paneflow/THIRD_PARTY_NOTICES.md
              ;;
            arch)
              # `-Sy` without `-u` is the documented Arch partial-upgrade trap:
              # it refreshes the package index but keeps the image's older
              # libraries, so a package built against a newer soname installs
              # cleanly and then fails to link at runtime.
              pacman -Syu --noconfirm --needed binutils fontconfig freetype2 glibc \
                libx11 libxcb libxkbcommon libxkbcommon-x11 vulkan-icd-loader
              mkdir -p /opt/paneflow-candidate
              tar -xzf "$package" -C /opt/paneflow-candidate
              binary=/opt/paneflow-candidate/paneflow.app/bin/paneflow
              notice=/opt/paneflow-candidate/paneflow.app/THIRD_PARTY_NOTICES.md
              ;;
          esac
          "$binary" --version
          scripts/verify-libghostty-package.sh --binary "$binary" --notice "$notice"
          smokes=("$PWD"/candidate/**/paneflow-ghostty-smoke)
          if (( ${#smokes[@]} != 1 )); then
            echo "expected one paneflow-ghostty-smoke, found ${#smokes[@]}" >&2
            exit 1
          fi
          smoke="${smokes[0]}"
          chmod +x "$smoke"
          "$smoke"

  validation-summary:
    name: libghostty validation
    if: ${{ !cancelled() }}
    needs: [changes, recipe, native, bindings, fuzz, distro-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every automated check
        env:
          # Fail-closed in both directions: a lane whose inputs changed must be
          # green, and a lane whose inputs did not must have actually skipped.
          # `skipped` is never silently accepted, so a lane dropped because
          # `native` failed still turns this job red. The consumer lanes follow
          # `native`, the engine lanes (recipe, bindings, fuzz) follow `recipe`.
          CONSUMER_EXPECTED: ${{ needs.changes.outputs.native }}
          ENGINE_EXPECTED: ${{ needs.changes.outputs.recipe }}
          NATIVE: ${{ needs.native.result }}
          BINDINGS: ${{ needs.bindings.result }}
          FUZZ: ${{ needs.fuzz.result }}
          DISTRO: ${{ needs.distro-smoke.result }}
          RECIPE: ${{ needs.recipe.result }}
        run: |
          status=0
          for lane in "native:$CONSUMER_EXPECTED:$NATIVE" \
                      "distro-smoke:$CONSUMER_EXPECTED:$DISTRO" \
                      "recipe:$ENGINE_EXPECTED:$RECIPE" \
                      "bindings:$ENGINE_EXPECTED:$BINDINGS" \
                      "fuzz:$ENGINE_EXPECTED:$FUZZ"; do
            name="${lane%%:*}"
            rest="${lane#*:}"
            expected="${rest%%:*}"
            result="${rest#*:}"
            if [ "$expected" = true ]; then want=success; else want=skipped; fi
            if [ "$result" != "$want" ]; then
              echo "::error::$name reported '$result', expected '$want'"
              status=1
            fi
            echo "$name: $result (expected $want)"
          done
          [ "$status" -eq 0 ] || exit 1
          echo "Every libghostty Linux lane reported the expected result."

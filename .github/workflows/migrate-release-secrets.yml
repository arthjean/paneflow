name: Migrate release secrets (one-off)

on:
  workflow_dispatch: {}

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  copy:
    name: Copy repository secrets into the release environment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Copy every signing and publishing secret
        env:
          GH_TOKEN: ${{ secrets.SECRET_MIGRATION_TOKEN }}
          SRC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SRC_APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          SRC_APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
          SRC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SRC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SRC_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SRC_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SRC_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SRC_AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          SRC_AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          SRC_AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          SRC_CLOUDFLARE_AUTH_KEY: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          SRC_CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          SRC_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          SRC_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SRC_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SRC_HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SRC_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SRC_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SRC_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SRC_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${GH_TOKEN:+set}" ]; then
            echo "::error::SECRET_MIGRATION_TOKEN is not set"
            exit 1
          fi
          missing=()
          copied=0
          for var in $(compgen -e | grep '^SRC_' | sort); do
            name="${var#SRC_}"
            if [ -z "${!var:+set}" ]; then
              missing+=("$name")
              continue
            fi
            printf '%s' "${!var}" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env release
            copied=$((copied + 1))
          done
          echo "copied $copied secret(s) into the release environment"
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not set at the repository level, so not copied: ${missing[*]}"
            exit 1
          fi

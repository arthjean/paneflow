name: Gungraun spike

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  spike:
    name: Instruction counts (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record the job start
        run: echo "SPIKE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/fetch-libghostty

      - name: Install Valgrind
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-gungraun-spike-retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: "gungraun-spike-"
          key: spike

      - name: Install the gungraun-runner matching the library
        run: |
          version=$(cargo metadata --locked --format-version=1 \
            | jq -r '.packages[] | select(.name == "gungraun") | .version')
          echo "gungraun $version"
          cargo install gungraun-runner --version "$version" --locked

      - name: Run the benchmarks twice
        run: scripts/gungraun-spike.sh

      - name: Summarize
        if: always()
        run: |
          total=$(( $(date +%s) - SPIKE_STARTED ))
          {
            echo "## Gungraun spike"
            echo
            echo "- job time so far: ${total} s (limit 900 s)"
            if [ -f target/gungraun-spike/summary.md ]; then
              cat target/gungraun-spike/summary.md
            else
              echo "- no summary: the benchmarks did not complete"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gungraun-spike
          path: target/gungraun-spike/
          retention-days: 14
          if-no-files-found: warn

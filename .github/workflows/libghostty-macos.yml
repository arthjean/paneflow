name: libghostty macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# The nightly gets a group of its own, so a push to main never cancels it.
concurrency:
  group: ${{ github.event_name == 'schedule' && format('{0}-schedule', github.workflow) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # Two clean ReleaseFast builds at -j1 are too slow for every push and PR.
  # What a PR needs to know is that the committed archive is intact, which
  # `paneflow-libghostty-sys` asserts against `manifest.archive_sha256` on
  # every cargo invocation in `run_tests.yml::macos_check`. That job also
  # owns the consumer gates: the static-link and notices contract and the
  # end-to-end PTY smoke. The full reproducibility proof, in
  # `libghostty-recipe.yml`, runs nightly and on demand, and must be run by
  # hand before re-pinning the archive.
  recipe:
    name: Reproducible rebuild
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/libghostty-recipe.yml
    with:
      targets: macos

  validation-summary:
    name: libghostty macOS validation
    if: ${{ !cancelled() }}
    needs: recipe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # `recipe` is schedule/dispatch-only, so on a push or a PR it
      # must report `skipped`, and on a scheduled or dispatched run it must
      # report `success`. `skipped` is never silently accepted for a lane
      # that was supposed to run. The consumer gates live in
      # `run_tests.yml::macos_check`, behind the `tests_pass` check.
      - name: Require the reproducible rebuild when it was due
        env:
          RECIPE: ${{ needs.recipe.result }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) want=success ;;
            *) want=skipped ;;
          esac
          if [ "$RECIPE" != "$want" ]; then
            echo "::error::recipe reported '$RECIPE', expected '$want'"
            exit 1
          fi
          echo "recipe: $RECIPE (expected $want)"

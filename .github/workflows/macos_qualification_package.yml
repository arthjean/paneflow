name: macos_qualification_package

# Builds the Apple Silicon qualification package for a candidate commit: the
# candidate app bundle, the session fixture, the prebuilt harness, the
# candidate manifest, profiling builds of the candidate and pre-refactor
# baseline hosts, and the on-machine scripts, all under one SHA256SUMS. The
# package is then extracted on this runner and exercised through the preflight
# and a quick harness run. With full_protocol set, the same job also runs the
# full host, worker, and desktop protocol, the W08 endurance rehearsal, and the
# memory and CPU profiles of both hosts, and fails when any of them fails: that
# run is the macOS qualification evidence on the hosted VM. See the macOS
# section of docs/release/persistent-qualification.md.
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Candidate commit or ref"
        required: false
        type: string
        default: main
      baseline_ref:
        description: "Pre-refactor baseline commit"
        required: false
        type: string
        default: f881c8bcce568c76d96ba7e691a0e26d86154215
      full_protocol:
        description: "Also run the full protocol, the W08 endurance rehearsal, and the host profiles as macOS qualification evidence"
        required: false
        type: boolean
        default: false
      profile_restore:
        description: "Diagnostic only: sample a symbolized desktop and host while the desktop restores the W01 sessions"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.candidate_ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  package:
    name: Build and rehearse the macOS qualification package
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/fetch-libghostty

      - name: Verify the Metal toolchain
        run: |
          xcrun --find metal
          sw_vers
          sysctl -n machdep.cpu.brand_string

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-darwin

      - name: Resolve identities
        id: ids
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          candidate=$(git rev-parse HEAD)
          baseline=$(git rev-parse --verify "$BASELINE_REF^{commit}")
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "paneflow-app") | .version')
          name="paneflow-macos-qualification-${candidate:0:12}"
          {
            echo "candidate=$candidate"
            echo "baseline=$baseline"
            echo "version=$version"
            echo "name=$name"
            echo "package=$RUNNER_TEMP/$name"
          } >>"$GITHUB_OUTPUT"

      - name: Build the candidate release binaries and the harness
        run: |
          cargo build --release --locked --target "$TARGET" -p paneflow-app -p paneflow-host
          cargo test --release --locked --target "$TARGET" -p paneflow-host --test persistent_baseline --no-run --message-format=json >"$RUNNER_TEMP/harness-build.json"
          harness=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "persistent_baseline" and .executable != null) | .executable' "$RUNNER_TEMP/harness-build.json" | tail -n 1)
          test -x "$harness"
          echo "HARNESS=$harness" >>"$GITHUB_ENV"

      - name: Bundle the candidate app and freeze its manifest
        env:
          PACKAGE: ${{ steps.ids.outputs.package }}
          VERSION: ${{ steps.ids.outputs.version }}
        run: |
          bash scripts/bundle-macos.sh --version "$VERSION" --arch aarch64
          release="target/$TARGET/release"
          for binary in paneflow paneflow-host; do
            cmp "$release/$binary" "dist/PaneFlow.app/Contents/MacOS/$binary"
          done
          mkdir -p "$PACKAGE/candidate/bin"
          scripts/candidate-manifest.sh --target "$TARGET" --out "$PACKAGE/candidate/candidate.json"
          grep -q '"dirty": false' "$PACKAGE/candidate/candidate.json"
          cp -R dist/PaneFlow.app "$PACKAGE/candidate/PaneFlow.app"
          install -m 0755 "$release/paneflow-session-fixture" "$PACKAGE/candidate/bin/paneflow-session-fixture"
          install -m 0755 "$HARNESS" "$PACKAGE/candidate/bin/persistent_baseline"
          install -m 0755 "$release/paneflow" "$PACKAGE/candidate/bin/paneflow-worker-replacement"

      - name: Build the profiling hosts at the candidate and the baseline
        env:
          PACKAGE: ${{ steps.ids.outputs.package }}
          BASELINE: ${{ steps.ids.outputs.baseline }}
          PROFILE_RESTORE: ${{ inputs.profile_restore }}
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-profiling-candidate" cargo build --release --locked --target "$TARGET" -p paneflow-host
          if [ "$PROFILE_RESTORE" = "true" ]; then
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-profiling-candidate" cargo build --release --locked --target "$TARGET" -p paneflow-app
          fi
          git worktree add --detach "$RUNNER_TEMP/baseline-src" "$BASELINE"
          (cd "$RUNNER_TEMP/baseline-src" && bash scripts/fetch-libghostty.sh --target "$TARGET")
          (cd "$RUNNER_TEMP/baseline-src" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-profiling-baseline" cargo build --release --locked --target "$TARGET" -p paneflow-host)
          for side in candidate baseline; do
            out="$RUNNER_TEMP/target-profiling-$side/$TARGET/release"
            mkdir -p "$PACKAGE/profiling/$side"
            install -m 0755 "$out/paneflow-host" "$PACKAGE/profiling/$side/paneflow-host"
            if [ -d "$out/paneflow-host.dSYM" ]; then
              cp -R "$out/paneflow-host.dSYM" "$PACKAGE/profiling/$side/"
            fi
          done
          if [ "$PROFILE_RESTORE" = "true" ]; then
            out="$RUNNER_TEMP/target-profiling-candidate/$TARGET/release"
            install -m 0755 "$out/paneflow" "$PACKAGE/profiling/candidate/paneflow"
            if [ -d "$out/paneflow.dSYM" ]; then
              cp -R "$out/paneflow.dSYM" "$PACKAGE/profiling/candidate/"
            fi
          fi

      - name: Add the on-machine scripts, identity, and checksums
        env:
          PACKAGE: ${{ steps.ids.outputs.package }}
          NAME: ${{ steps.ids.outputs.name }}
          CANDIDATE: ${{ steps.ids.outputs.candidate }}
          BASELINE: ${{ steps.ids.outputs.baseline }}
        run: |
          mkdir -p "$PACKAGE/scripts"
          for script in bench-persistent.sh qualify-macos-preflight.sh profile-host-macos.sh; do
            install -m 0755 "scripts/$script" "$PACKAGE/scripts/$script"
          done
          {
            echo "package: $NAME"
            echo "candidate: $CANDIDATE"
            echo "baseline: $BASELINE"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "toolchain: $(rustc -V)"
            echo "runner: $(sw_vers -productVersion) $(sw_vers -buildVersion), $(sysctl -n machdep.cpu.brand_string)"
            echo "signing: linker ad-hoc signatures only; not Developer ID signed and not notarized, so Gatekeeper and notarized distribution are not certified by this package"
            echo "profiling: line-tables-only debug info, unstripped, packed dSYM; both hosts are driven by the candidate fixture"
          } >"$PACKAGE/PACKAGE.txt"
          (cd "$PACKAGE" && find . -type f ! -name SHA256SUMS | LC_ALL=C sort | tr '\n' '\0' | xargs -0 shasum -a 256 >SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/out"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/out/$NAME.tar.gz" "$NAME"
          (cd "$RUNNER_TEMP/out" && shasum -a 256 "$NAME.tar.gz" >"$NAME.tar.gz.sha256")

      - name: Rehearse the extracted package on this runner
        env:
          NAME: ${{ steps.ids.outputs.name }}
          FULL_PROTOCOL: ${{ inputs.full_protocol }}
        run: |
          rehearsal="$RUNNER_TEMP/rehearsal"
          mkdir -p "$rehearsal"
          (cd "$RUNNER_TEMP/out" && shasum -a 256 -c "$NAME.tar.gz.sha256")
          tar -C "$rehearsal" -xzf "$RUNNER_TEMP/out/$NAME.tar.gz"
          pkg="$rehearsal/$NAME"
          set +e
          "$pkg/scripts/qualify-macos-preflight.sh" --package "$pkg" --root "$rehearsal/root" --min-free-gib 5
          preflight=$?
          "$pkg/scripts/bench-persistent.sh" --prebuilt "$pkg/candidate" --with-worker --quick
          bench=$?
          set -e
          ledger=$(ls "$rehearsal"/root/evidence/preflight-*/ledger.tsv)
          result=$(ls -t "$pkg"/bench/results/persistent-*.json | head -n 1)
          for check in M07-package-integrity M12-host M13-desktop M14-evidence-export; do
            grep -q "^$check	pass	" "$ledger"
          done
          jq -e '.workloads.W05.final | (.host_threads != null) and (.host_handles != null) and (.host_resident_bytes != null)' "$result"
          jq -e '.scenarios[-1].host.attribution == "exact thread names"' "$result"
          full="skipped"
          endurance="skipped"
          profiles="skipped"
          evidence="$RUNNER_TEMP/qualification-evidence"
          mkdir -p "$evidence/profiles"
          if [ "$FULL_PROTOCOL" = "true" ]; then
            set +e
            "$pkg/scripts/bench-persistent.sh" --prebuilt "$pkg/candidate" --with-desktop --worker-replacement "$pkg/candidate/bin/paneflow-worker-replacement"
            full=$?
            jq -e '[.workloads.W04.worker_replacement.cycles[] | select(.build_replacement)] | length > 0' "$(ls -t "$pkg"/bench/results/persistent-2*.json | head -n 1)" || full=1
            PANEFLOW_BENCH_BURST_MINUTES=2 PANEFLOW_BENCH_WORKER_CYCLES=6 PANEFLOW_BENCH_DESKTOP_CYCLES=4 PANEFLOW_BENCH_SAMPLE_SECONDS=30 \
              "$pkg/scripts/bench-persistent.sh" --prebuilt "$pkg/candidate" --with-desktop --endurance 12 --idle-minutes 4
            endurance=$?
            profiles=0
            for side in candidate baseline; do
              for mode in memory cpu; do
                "$pkg/scripts/profile-host-macos.sh" "$pkg/profiling/$side/paneflow-host" "$pkg/candidate/bin/paneflow-session-fixture" "$mode" "$evidence/profiles/$mode" "$side" || profiles=1
              done
            done
            set -e
            for phase in empty idle50 after_output after_churn after_stop; do
              for side in candidate baseline; do
                grep -Eq "^$side	$phase	.*phys_footprint=[0-9]" "$evidence/profiles/memory/memory.tsv" || profiles=1
              done
            done
            grep -q "^candidate	survivors	none$" "$evidence/profiles/memory/memory.tsv" || profiles=1
            grep -q "^candidate	survivors	none$" "$evidence/profiles/cpu/memory.tsv" || profiles=1
            for side in candidate baseline; do
              for workload in idle output; do
                test -s "$evidence/profiles/cpu/sample-$workload-$side.txt" || profiles=1
              done
            done
          fi
          cp -R "$(dirname "$ledger")" "$pkg/bench/results" "$evidence/"
          {
            echo "## macOS qualification package"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Package | \`$NAME.tar.gz\` |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "$RUNNER_TEMP/out/$NAME.tar.gz.sha256")\` |"
            echo "| Preflight exit (M04 fails on the hosted VM) | $preflight |"
            echo "| Quick harness exit | $bench |"
            echo "| Full host, worker, and desktop protocol exit | $full |"
            echo "| W08 endurance rehearsal exit | $endurance |"
            echo "| Host profiles (1 when a profile or check is missing) | $profiles |"
            echo
            echo '```'
            cat "$ledger"
            if [ -f "$evidence/profiles/memory/memory.tsv" ]; then
              cat "$evidence/profiles/memory/memory.tsv"
            fi
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          for exit_code in "$full" "$endurance" "$profiles"; do
            [ "$exit_code" = "skipped" ] || [ "$exit_code" -eq 0 ]
          done

      - name: Sample the desktop restoration (diagnostic, never evidence)
        if: inputs.profile_restore
        env:
          NAME: ${{ steps.ids.outputs.name }}
        run: |
          pkg="$RUNNER_TEMP/rehearsal/$NAME"
          diag="$RUNNER_TEMP/restore-diagnostic"
          out="$RUNNER_TEMP/qualification-evidence/restore"
          mkdir -p "$diag" "$out"
          cp -R "$pkg/candidate" "$diag/candidate"
          macos="$diag/candidate/PaneFlow.app/Contents/MacOS"
          install -m 0755 "$pkg/profiling/candidate/paneflow" "$macos/paneflow"
          install -m 0755 "$pkg/profiling/candidate/paneflow-host" "$macos/paneflow-host"
          for dsym in paneflow.dSYM paneflow-host.dSYM; do
            if [ -d "$pkg/profiling/candidate/$dsym" ]; then
              cp -R "$pkg/profiling/candidate/$dsym" "$macos/"
            fi
          done
          watch_desktops() {
            local seen=" " launch=0 pid host
            while [ "$launch" -lt 4 ] && [ ! -e "$diag/harness-done" ]; do
              for pid in $(ps -axo pid=,command= | awk -v bin="$macos/paneflow" '$2 == bin && NF == 2 {print $1}'); do
                case "$seen" in *" $pid "*) continue ;; esac
                seen="$seen$pid "
                launch=$((launch + 1))
                ps -axo pid=,ppid=,command= >"$out/ps-launch$launch.txt"
                sample "$pid" 25 -file "$out/sample-desktop-launch$launch.txt" >/dev/null 2>&1 &
                for host in $(pgrep -f "$macos/paneflow-host serve"); do
                  sample "$host" 25 -file "$out/sample-host-launch$launch-$host.txt" >/dev/null 2>&1 &
                done
              done
              sleep 0.2
            done
            wait
          }
          watch_desktops &
          watcher=$!
          set +e
          "$pkg/scripts/bench-persistent.sh" --prebuilt "$diag/candidate" --with-desktop --quick >"$out/harness.log" 2>&1
          harness=$?
          touch "$diag/harness-done"
          wait "$watcher"
          set -e
          result=$(ls -t "$pkg"/bench/results/persistent-*.json | head -n 1)
          cp "$result" "$out/"
          {
            echo "## Desktop restoration diagnostic"
            echo
            echo "Harness exit: $harness (quick protocol with the symbolized desktop and host; never evidence)"
            echo
            echo '```'
            jq -c '.scenarios[] | {sessions, restore_ms: .desktop_restore.ready_ms}' "$result" || true
            tail -n 5 "$out/harness.log"
            for file in "$out"/sample-*.txt; do
              echo "== $(basename "$file")"
              sed -n '/^Sort by top of stack/,/^$/p' "$file" | head -n 25
            done
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.ids.outputs.name }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.ids.outputs.name }}-evidence
          path: ${{ runner.temp }}/qualification-evidence/
          if-no-files-found: warn
          retention-days: 30

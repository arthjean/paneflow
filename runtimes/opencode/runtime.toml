schema_version = 1
id = "ai.opencode.cli"
slug = "opencode"
label = "OpenCode"
platforms = ["linux", "macos"]

[display]
order = 2
icon_asset_path = "icons/opencode-color.svg"
icon_multicolor = false
visibility_config_key = "opencode_button_visible"

[detection]
command_aliases = ["opencode"]
process_aliases = ["opencode"]
script_path_signatures = []

[environment]
strip_inherited = []

[lifecycle]
source = "output"
authority = "screen"
fallback = "screen"
escape_cancels_turn = false
attention_clears_on_output = true
anchor_start_event_to_output = true

[integration]
summary = "OpenCode turn status is read from its screen."
hook_adapter = "none"
mcp_config = "opencode"

[resume]
session_argv = ["opencode", "--session", "{session_id}"]
session_id_pattern = '^ses_[A-Za-z0-9_]+$'
failure_markers = []

[sessions]
reader = "opencode"

[[suggested_presets]]
id = "opencode"
command = "opencode"

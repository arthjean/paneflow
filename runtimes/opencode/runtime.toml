schema_version = 1
id = "ai.opencode.cli"
slug = "opencode"
label = "OpenCode"
platforms = ["linux", "macos"]

[display]
order = 2
icon_asset_path = "icons/opencode-color.svg"
icon_multicolor = false
visibility_config_key = "opencode_button_visible"

[detection]
command_aliases = ["opencode"]
process_aliases = ["opencode"]
script_path_signatures = []

[environment]
strip_inherited = []

[lifecycle]
source = "hooks"
authority = "complete"
fallback = "none"
escape_cancels_turn = false
attention_clears_on_output = true
anchor_start_event_to_output = true

[integration]
summary = "Installs the Paneflow lifecycle plugin in OpenCode's global configuration."
hook_adapter = "opencode"

[[suggested_presets]]
id = "opencode"
command = "opencode"

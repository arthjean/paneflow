schema_version = 1
id = "dev.mariozechner.pi"
slug = "pi"
label = "Pi"
platforms = ["linux", "macos"]

[display]
order = 3
icon_asset_path = "icons/pi-coding-agent.svg"
icon_multicolor = false
visibility_config_key = "pi_button_visible"

[detection]
command_aliases = ["pi"]
process_aliases = ["pi"]
script_path_signatures = []

[environment]
strip_inherited = []

[integration]
summary = "Paneflow shows Pi's turn status when Pi reports it through OSC 7501."
hook_adapter = "none"

[resume]
session_argv = ["pi", "--session", "{session_id}"]
session_id_pattern = '^[A-Za-z0-9_][A-Za-z0-9_-]*$'
failure_markers = []

[sessions]
reader = "pi"

[[suggested_presets]]
id = "pi"
command = "pi"

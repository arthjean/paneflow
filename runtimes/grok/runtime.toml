schema_version = 1
id = "ai.x.grok-cli"
slug = "grok"
label = "Grok"
platforms = ["linux", "macos"]

[display]
order = 5
icon_asset_path = "agents/grok.svg"
icon_multicolor = false
visibility_config_key = "grok_button_visible"

[detection]
command_aliases = ["grok"]
process_aliases = ["grok", "grok-build"]
script_path_signatures = []

[environment]
strip_inherited = []

[integration]
summary = "Paneflow shows Grok's turn status when Grok reports it through OSC 7501."
hook_adapter = "none"

[resume]
session_argv = ["grok", "--resume", "{session_id}"]
session_id_pattern = '^[A-Za-z0-9_][A-Za-z0-9_-]*$'
failure_markers = []

[sessions]
reader = "grok"

[[suggested_presets]]
id = "grok"
command = "grok"

schema_version = 1
id = "com.google.gemini-cli"
slug = "gemini"
label = "Gemini"
platforms = ["linux", "macos", "windows"]
capabilities = ["lifecycle_hooks", "screen_activity", "integration_install"]

[display]
order = 8
icon_asset_path = "agents/gemini-color.svg"
icon_multicolor = true
visibility_config_key = "gemini_button_visible"

[detection]
command_aliases = ["gemini"]
process_aliases = ["gemini"]
script_path_signatures = []

[environment]
strip_inherited = []

[lifecycle]
source = "hooks"
authority = "complete"
fallback = "screen"
escape_cancels_turn = true
attention_clears_on_output = true
anchor_start_event_to_output = true
terminal_title_signal = false

[screen]
working = ["esc to cancel"]
idle_prompt = ["Type your message", "> Type your message"]

[integration]
summary = "Installs Paneflow lifecycle hooks in Gemini CLI's global settings."
hook_adapter = "gemini"

[install]
command = "npm install -g @google/gemini-cli"

[[suggested_presets]]
id = "gemini"
label = "Gemini"
command = "gemini"
quick_launch = false

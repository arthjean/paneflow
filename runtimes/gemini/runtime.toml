schema_version = 1
id = "com.google.gemini-cli"
slug = "gemini"
label = "Gemini"
platforms = ["linux", "macos", "windows"]

[display]
order = 8
icon_asset_path = "agents/gemini-color.svg"
icon_multicolor = true
visibility_config_key = "gemini_button_visible"

[detection]
command_aliases = ["gemini"]
process_aliases = ["gemini"]
script_path_signatures = []

[environment]
strip_inherited = []

[integration]
summary = "Paneflow shows Gemini CLI's turn status when Gemini CLI reports it through OSC 7501."
hook_adapter = "none"
mcp_config = "gemini"

[resume]
session_argv = ["gemini", "--resume", "{session_id}"]
session_id_pattern = '^[A-Za-z0-9_][A-Za-z0-9_-]*$'
failure_markers = []

[sessions]
reader = "gemini"

[[suggested_presets]]
id = "gemini"
command = "gemini"

schema_version = 1
id = "ai.deepseek.harness"
slug = "deepseek-harness"
label = "DeepSeek Harness"
platforms = ["linux", "macos"]
capabilities = []

[display]
order = 16
tint = "#4D6BFE"
icon_asset_path = "agents/deepseek-color.svg"
icon_multicolor = false
visibility_config_key = "deepseek_harness_button_visible"

[detection]
command_aliases = ["dsh"]
process_aliases = ["dsh"]
script_path_signatures = []

[environment]
strip_inherited = []

[lifecycle]
source = "hooks"
authority = "none"
fallback = "none"
escape_cancels_turn = false
attention_clears_on_output = true
anchor_start_event_to_output = true
terminal_title_signal = false

[integration]
summary = "DeepSeek Harness reports turn activity through the Claude Code hooks bridge; its stream is not a lifecycle authority."
hook_adapter = "dsh"

[install]
command = ""

[[suggested_presets]]
id = "deepseek_harness"
label = "DeepSeek Harness"
command = "dsh --profile tui"
quick_launch = false

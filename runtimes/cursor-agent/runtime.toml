schema_version = 1
id = "com.cursor.agent"
slug = "cursor-agent"
label = "Cursor"
platforms = ["linux", "macos"]

[display]
order = 7
icon_asset_path = "agents/cursor.svg"
icon_multicolor = false
visibility_config_key = "cursor_button_visible"

[detection]
command_aliases = ["cursor-agent"]
process_aliases = ["cursor-agent"]
script_path_signatures = []

[environment]
strip_inherited = []

[lifecycle]
source = "output"
authority = "none"
fallback = "none"
escape_cancels_turn = false
attention_clears_on_output = true
anchor_start_event_to_output = true

[integration]
summary = "Cursor Agent is detected from its process; Paneflow reads no turn status from it."
hook_adapter = "none"

[[suggested_presets]]
id = "cursor"
command = "cursor-agent"

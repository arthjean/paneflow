schema_version = 1
id = "com.cursor.agent"
slug = "cursor-agent"
label = "Cursor"
platforms = ["linux", "macos"]
capabilities = ["lifecycle_hooks", "integration_install"]

[display]
order = 7
icon_asset_path = "agents/cursor.svg"
icon_multicolor = false
visibility_config_key = "cursor_button_visible"

[detection]
command_aliases = ["cursor-agent"]
process_aliases = ["cursor-agent"]
script_path_signatures = []

[environment]
strip_inherited = []

[lifecycle]
source = "hooks"
authority = "complete"
fallback = "none"
escape_cancels_turn = false
attention_clears_on_output = true
anchor_start_event_to_output = true
terminal_title_signal = false

[integration]
summary = "Installs Paneflow lifecycle hooks in Cursor Agent's global configuration."
hook_adapter = "cursor"

[install]
command = ""

[[suggested_presets]]
id = "cursor"
label = "Cursor"
command = "cursor-agent"
quick_launch = false

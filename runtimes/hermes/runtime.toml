schema_version = 1
id = "ai.hermes.agent"
slug = "hermes"
label = "Hermes Agent"
platforms = ["linux", "macos"]

[display]
order = 4
icon_asset_path = "icons/hermesagent.svg"
icon_multicolor = false
visibility_config_key = "hermes_agent_button_visible"

[detection]
command_aliases = ["hermes"]
process_aliases = ["hermes"]
script_path_signatures = []

[environment]
strip_inherited = []

[lifecycle]
source = "output"
authority = "screen"
fallback = "screen"
escape_cancels_turn = false
attention_clears_on_output = true
anchor_start_event_to_output = true

[integration]
summary = "Hermes Agent turn status is read from its screen."
hook_adapter = "none"

[[suggested_presets]]
id = "hermes"
command = "hermes"

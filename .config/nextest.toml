[profile.ci]
retries = 1
flaky-result = "fail"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Quarantine: at most four tests, each with its tracking issue. A quarantined
# test is retried twice and reported as a warning when it passes on a retry.

# https://github.com/arthjean/paneflow/issues/115
[[profile.ci.overrides]]
filter = "package(paneflow-host) & kind(lib) & test(=host::tests::a_restart_gives_a_record_without_a_data_directory_its_directory_back)"
retries = 2
flaky-result = "pass"

# https://github.com/arthjean/paneflow/issues/116
[[profile.ci.overrides]]
filter = "binary_id(paneflow-app::bin/paneflow) & test(=git_command::tests::agent_commits_never_hit_index_lock_while_probes_run)"
retries = 2
flaky-result = "pass"

# https://github.com/arthjean/paneflow/issues/117
[[profile.ci.overrides]]
filter = "binary_id(paneflow-host::ownership_probes) & test(=h01_root_exit_and_pty_hangup_do_not_prove_descendant_exit)"
retries = 2
flaky-result = "pass"

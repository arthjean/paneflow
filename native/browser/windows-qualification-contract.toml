    "a split adapter assignment now presents: with paneflow.exe forced onto the AMD iGPU and the staged host image left unset, the host pinned itself to the application adapter 0-16920 and the scenario completed with 277 frame events, first frame after 2787 ms, target/ep004-gpu-split-pin/prototype.jsonl with target/ep004-gpu-split-pin/host.stderr",

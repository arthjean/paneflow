findings = [
    "A hybrid host that placed the application and the browser host on different adapters used to fail the presentation outright: with paneflow.exe forced onto the AMD iGPU while the staged host stayed on the NVIDIA adapter, the first shared texture import returned 0x80070057 and the pane terminated with zero frame events (target/ep004-gpu-amd/prototype.jsonl, target/ep004-gpu-amd/host.stderr). Windows assigns the adapter per executable image, and the staged host copy does not inherit the preference set on the shipped one, so the split was reachable without any user intent.",
    "Resolved on 2026-09-11: the application passes the LUID of its own D3D11 device to the host, which opens that adapter with IDXGIFactory4::EnumAdapterByLuid and forwards the LUID to Chromium as --use-adapter-luid, so the CEF GPU process, the host and the renderer share one adapter. The split case now completes (target/ep004-gpu-split-pin), it still completes when the two images carry opposite explicit preferences (target/ep004-gpu-split-forced), and the unforced pairing is unchanged (target/ep004-gpu-default-pin). A host that cannot open the application adapter refuses the page and names both the wanted adapter and the ones it sees; a CEF texture from another adapter is reported with its owning adapter through IDXGIFactory2::GetSharedResourceAdapterLuid.",
]


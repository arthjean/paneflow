id = "performance"
release = "human"
owner = "US-014"
status = "WORKS_MEASURED"
evidence_kind = "native_m1_campaign"
evidence = "target/ep004-m1-120hz-v2/m1-comparison.json and target/ep004-m1-60hz-v2/m1-comparison.json"
observed_on = "Windows 11 build 26200 UBR 9445, NVIDIA GeForce RTX 4070 Ti SUPER driver 32.0.16.1656, 1920x1080 physical viewport, 59.94 Hz and 120 Hz modes, five repetitions per configuration, application binary sha256 f5ef6cd1c98bbbb8a44a38427cdc19e29897ab5d4d20b9febfd8acff9468f134, captured 2026-09-12"
native_release_qualified = false
requires = [
    "M1 A/B/C on the same pin and machine",
    "1920x1080 physical viewport",
    "60 Hz and 120 Hz modes",
    "five repetitions per configuration",
    "foreground ownership proven on every capture",
    "raw data retained",
]
deferred = ["NFR-01", "NFR-04", "NFR-05", "NFR-06", "NFR-07", "NFR-08", "NFR-11", "NFR-13"]
partial_evidence = "target/ep002-m1-r0/m1-comparison.json"
measured = [
    "target/ep004-m1-120hz-v2: A/B/C, five repetitions each, 1920x1080 physical viewport at the 120 Hz mode, every capture holding the foreground for its whole duration",
    "target/ep004-m1-60hz-v2: A/B/C, five repetitions each, 1920x1080 physical viewport at the 59.94 Hz mode, every capture holding the foreground for its whole duration",
    "bench/browser/dock/2026-09-11-windows-lag: three baseline and three corrected repetitions of 20 s idle, 20 s scroll and 20 s resize, one paint-path probe and five resize variants, all on the pinned Linux fixture at a common SHA-256",
]
discarded = [
    "target/ep004-m1-60hz-r3 and target/ep004-m1-120hz-r2 are invalid: the benchmark window lost the foreground during captures, which throttles presentation and inflates terminal latency. They are kept only as the evidence of the harness defect named below.",
    "target/ep004-m1-60hz and target/ep004-m1-120hz were captured before the harness recorded foreground ownership, so they cannot prove the window held it. Their numbers are unproven rather than wrong.",
]
findings = [
    "The M1 harness accepted captures in which the benchmark window was not in the foreground, and Windows throttles a background window's presentation. The symptom read as a latency regression: configuration A, terminals with the Browser never started, measured 43.67 ms terminal_input_to_present p95 in one campaign and 62.36 ms in another on the same machine. It is not a product change. The foreground state was the only variable.",
    "Proven by a controlled experiment. A capture that holds the foreground presents about 445 frames per two-second slice; stealing the foreground with a maximized Notepad twelve seconds in drops it to 74 per slice for the rest of the capture, with no other change: 445, 445, 427, 74, 74, 74, 74, 74, 74, 74 (target/probe-steal-01). Polling the foreground window every 500 ms across separate captures gives a clean split: 550 presents and 56.0 ms p95 with the window backgrounded 47 samples out of 69, against 3252 presents and 35.6 ms p95 with the window foreground for all of them (target/probe-09, target/probe-10, target/probe-11).",
    "The latency decomposes accordingly. Scene to displayed stays at 14.0 to 14.7 ms p95 in every capture, fast or slow; only input to scene moves, from 25 to 32 ms when the app presents about 6700 frames per minute to 51 to 56 ms when it presents about 1800. The input simply waits for the next frame of a throttled redraw loop.",
    "The earlier bisect across preserved binaries was an artifact of the same defect: the per-repetition p95 is bimodal in every run, and the binary that was supposed to be clean also produced a slow repetition (target/ep004-m1-120hz-prefixA measures 38.0, 66.1 and 43.9 ms). A median over three repetitions hid it. No binary difference was ever demonstrated.",
    "Corrected in the harness. scripts/browser-qualification/windows-capture.ps1 samples the foreground window every second and records foreground_pid and foreground_owned in resources.jsonl; windows-analysis.mjs reports window_foreground and sets status INVALID_WINDOW_NOT_FOREGROUND when ownership is not complete; windows-m1-compare.mjs refuses a campaign containing a capture its own analysis rejected, instead of averaging it. A capture recorded before this change reports a null ratio and claims nothing.",
    "Re-run under the corrected harness on an untouched machine, both campaigns are clean: thirty captures, every one reporting window_foreground ratio 1, zero unmatched presents and at most one dropped present. The per-repetition spread that made the earlier campaigns look bimodal is gone: configuration A p95 at 120 Hz lands between 41.2 and 45.4 ms across its five repetitions. NFR-02 and NFR-03 are readable again and both land near zero, which also shows the morning campaigns had been right without being able to prove it.",
]
established = [
    "the analyzer already refuses any capture whose presentation viewport is not 1920x1080 physical pixels",
    "browser_callback_to_present carries 16210 samples in configuration B and 16213 in configuration C at 60 Hz, and 17640 and 17623 at 120 Hz; configuration A has none by construction since it runs without Browser",
]


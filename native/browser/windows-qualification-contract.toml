    "SEC-09..SEC-12",
    "C3 quotas at their limit and limit plus one",
    "two workspaces",
    "two clients",
    "stale generations",
    "host restart",
    "human takeover",
]
covered = [
    "the shared browser.* controller, its ownership checks and its C3 bounds are executed by the workspace test suite run natively on Windows 11 build 26200",
    "the whole agent lifecycle replays against the current application binary: target/ep004-agent-r11/prototype.jsonl ends on status COMPLETED with op-4 leaving AwaitCommit on Ok(Completed), op-5 refused with Err(StaleGeneration) and op-6 cancelled by the human takeover with Err(Unavailable)",
    "the native agent navigation terminalizes at the main-document commit: target/ep004-agent-r9/prototype.jsonl and target/ep004-agent-r10/prototype.jsonl both end on status COMPLETED, and op-4 leaves AwaitCommit on Ok(Completed) at document generation 3 once the CEF main frame commits http://127.0.0.1:18762/scroll",
    "stale generations are refused natively: op-5 carries document generation 4 against the live generation 3 and the controller answers Err(StaleGeneration)",
    "human takeover cancels a pending agent navigation natively: op-6 is superseded by a human Command::Navigate and terminalizes as Err(Unavailable) with the reason human browser control",
    "the defect that kept the agent operation pending was in src-app/src/browser/page.rs: the Windows LivePage carried no branch for agent_navigation_committed, agent_navigation_failed or agent_navigation_cancelled, so native_signals dropped the whole family through the unscoped_signals fallback",
    "the D3D11 retire deadline that fired on every navigation was in crates/paneflow-browser-host/src/windows.rs: FrameAck routing demanded page.document == document, so every frame release belonging to a superseded generation was discarded and its pool never drained",
]
observed_on = "Windows 11 build 26200 UBR 9445 25H2, two 2560x1440 monitors at 100 percent; cargo test --workspace --locked and the browser-prototype agent scenario against the test-signed EP-004 bundle, run natively on 2026-09-11"
missing = [
    "no host restart has been observed natively",
    "the C3 quotas at their limit and limit plus one, two workspaces and two clients are not exercised natively",
    "SEC-12 has no native proof",
]


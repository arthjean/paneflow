[[targets]]
id = "gpu-displays"
release = "human"
owner = "US-013"
status = "NOT_EXECUTED"
evidence_kind = "native_gpu_and_display_matrix"
native_release_qualified = false
requires = [
    "Windows 10 1809 exact build",
    "Windows 11 exact build",
    "NVIDIA",
    "at least one Intel or AMD GPU",
    "multi-display DPI",
]
covered = [
    "Windows 11 build 26200 UBR 9278 on NVIDIA GeForce RTX 4070 Ti SUPER driver 32.0.16.1656",
    "two 2560x1440 displays at 100 percent with a monitor change and two DPI transitions",
    "NVIDIA GeForce RTX 4070 Ti SUPER (0x10de:0x2705) drove the presentation path: 167 frame events, first frame after 3360 ms, target/ep004-gpu-nvidia2/prototype.jsonl with target/ep004-gpu-nvidia2/adapter.txt",
    "AMD Radeon(TM) Graphics (0x1002:0x164e) drove the presentation path: 167 frame events, first frame after 2726 ms, target/ep004-gpu-amd-run/prototype.jsonl with target/ep004-gpu-amd-run/host.stderr",
    "a split adapter assignment now presents: with paneflow.exe forced onto the AMD iGPU and the staged host image left unset, the host pinned itself to the application adapter 0-16920 and the scenario completed with 277 frame events, first frame after 2787 ms, target/ep004-gpu-split-pin/prototype.jsonl with target/ep004-gpu-split-pin/host.stderr",
    "the adversarial split presents: with paneflow.exe forced onto the AMD iGPU and the staged host image forced onto the NVIDIA adapter, the host still pinned itself to 0-16920 and the scenario completed with 276 frame events, first frame after 2793 ms, target/ep004-gpu-split-forced/prototype.jsonl with target/ep004-gpu-split-forced/host.stderr",
    "the unforced pairing still presents on the discrete adapter: both images left unset, the host pinned itself to 0-1474d and the scenario completed with 272 frame events, first frame after 2859 ms, target/ep004-gpu-default-pin/prototype.jsonl with target/ep004-gpu-default-pin/host.stderr",
    "the adapter pin was re-confirmed independently against the current binary and the re-signed bundle: target/ep004-gpu-animated on the discrete adapter with 195 frame events and a first frame after 2536 ms, target/ep004-gpu-amd-pinned on the integrated adapter with 194 frame events and a first frame after 2999 ms, both reporting pinned_to_application true",
]
waived = [
    "the Windows 10 1809 run, under the minimum-product waiver of 2026-09-11",
]
missing = [
    "no display pair with different scale factors",
    "no switchable-graphics laptop, so the adapter pin is proven only on a desktop whose two adapters are both enumerable from either process",
]
observed_on = "Windows 11 build 26200 UBR 9445, NVIDIA GeForce RTX 4070 Ti SUPER driver 32.0.16.1656 and AMD Radeon(TM) Graphics of a Ryzen 7 7800X3D, selected per executable image through UserGpuPreferences on 2026-09-11"
findings = [
    "A hybrid host that placed the application and the browser host on different adapters used to fail the presentation outright: with paneflow.exe forced onto the AMD iGPU while the staged host stayed on the NVIDIA adapter, the first shared texture import returned 0x80070057 and the pane terminated with zero frame events (target/ep004-gpu-amd/prototype.jsonl, target/ep004-gpu-amd/host.stderr). Windows assigns the adapter per executable image, and the staged host copy does not inherit the preference set on the shipped one, so the split was reachable without any user intent.",
    "Resolved on 2026-09-11: the application passes the LUID of its own D3D11 device to the host, which opens that adapter with IDXGIFactory4::EnumAdapterByLuid and forwards the LUID to Chromium as --use-adapter-luid, so the CEF GPU process, the host and the renderer share one adapter. The split case now completes (target/ep004-gpu-split-pin), it still completes when the two images carry opposite explicit preferences (target/ep004-gpu-split-forced), and the unforced pairing is unchanged (target/ep004-gpu-default-pin). A host that cannot open the application adapter refuses the page and names both the wanted adapter and the ones it sees; a CEF texture from another adapter is reported with its owning adapter through IDXGIFactory2::GetSharedResourceAdapterLuid.",
]

[[targets]]
id = "performance"
release = "human"
owner = "US-014"
status = "NOT_EXECUTED"
evidence_kind = "native_m1_campaign"
native_release_qualified = false
requires = [
    "M1 A/B/C on the native references",
    "D3D and OS presentation traces",
    "native Windows CPU and memory profilers",
    "1920x1080",
    "qualified 60 Hz and 120 Hz",
    "five repetitions",
    "raw data retained",
    "Browser tree private working set",
    "parent delta",
    "GPU memory",
    "Windows handles",
    "interop separated from internal Chromium VRAM",
]
partial_evidence = "target/ep002-m1-r0/m1-comparison.json"
measured = [
    "target/ep004-m1-120hz-v2: A/B/C, five repetitions each, 1920x1080 physical viewport at the 120 Hz mode, every capture holding the foreground for its whole duration",
    "target/ep004-m1-60hz-v2: A/B/C, five repetitions each, 1920x1080 physical viewport at the 59.94 Hz mode, every capture holding the foreground for its whole duration",
    "bench/browser/dock/2026-09-11-windows-lag: three baseline and three corrected repetitions of 20 s idle, 20 s scroll and 20 s resize, one paint-path probe and five resize variants, all on the pinned Linux fixture at a common SHA-256",
]
discarded = [
    "target/ep004-m1-60hz-r3 and target/ep004-m1-120hz-r2 are invalid: the benchmark window lost the foreground during captures, which throttles presentation and inflates terminal latency. They are kept only as the evidence of the harness defect named below.",
    "target/ep004-m1-60hz and target/ep004-m1-120hz were captured before the harness recorded foreground ownership, so they cannot prove the window held it. Their numbers are unproven rather than wrong.",
]
missing = [
    "NFR-02 at 120 Hz is 0.106 ms over its p95 budget on a delta the method cannot resolve, so the row cannot be closed on it; settling it needs paired per-repetition deltas or more repetitions",
    "GPU memory is not sampled and interop allocations are not separated from internal Chromium VRAM; the resource samples cover private working set, handles and CPU only",
    "the integration memory overhead of NFR-07 needs a C over B delta, which the comparison tool does not compute; it reports C over A, the whole Browser tree",
    "NFR-01, NFR-04, NFR-05, NFR-06, NFR-08 and NFR-11 have no campaign",
]
findings = [
    "The M1 harness accepted captures in which the benchmark window was not in the foreground, and Windows throttles a background window's presentation. The symptom read as a latency regression: configuration A, terminals with the Browser never started, measured 43.67 ms terminal_input_to_present p95 in one campaign and 62.36 ms in another on the same machine. It is not a product change. The foreground state was the only variable.",
    "Proven by a controlled experiment. A capture that holds the foreground presents about 445 frames per two-second slice; stealing the foreground with a maximized Notepad twelve seconds in drops it to 74 per slice for the rest of the capture, with no other change: 445, 445, 427, 74, 74, 74, 74, 74, 74, 74 (target/probe-steal-01). Polling the foreground window every 500 ms across separate captures gives a clean split: 550 presents and 56.0 ms p95 with the window backgrounded 47 samples out of 69, against 3252 presents and 35.6 ms p95 with the window foreground for all of them (target/probe-09, target/probe-10, target/probe-11).",
    "The latency decomposes accordingly. Scene to displayed stays at 14.0 to 14.7 ms p95 in every capture, fast or slow; only input to scene moves, from 25 to 32 ms when the app presents about 6700 frames per minute to 51 to 56 ms when it presents about 1800. The input simply waits for the next frame of a throttled redraw loop.",
    "The earlier bisect across preserved binaries was an artifact of the same defect: the per-repetition p95 is bimodal in every run, and the binary that was supposed to be clean also produced a slow repetition (target/ep004-m1-120hz-prefixA measures 38.0, 66.1 and 43.9 ms). A median over three repetitions hid it. No binary difference was ever demonstrated.",
    "Corrected in the harness. scripts/browser-qualification/windows-capture.ps1 samples the foreground window every second and records foreground_pid and foreground_owned in resources.jsonl; windows-analysis.mjs reports window_foreground and sets status INVALID_WINDOW_NOT_FOREGROUND when ownership is not complete; windows-m1-compare.mjs refuses a campaign containing a capture its own analysis rejected, instead of averaging it. A capture recorded before this change reports a null ratio and claims nothing.",
    "Re-run under the corrected harness on an untouched machine, both campaigns are clean: thirty captures, every one reporting window_foreground ratio 1, zero unmatched presents and at most one dropped present. The per-repetition spread that made the earlier campaigns look bimodal is gone: configuration A p95 at 120 Hz lands between 41.2 and 45.4 ms across its five repetitions. NFR-02 and NFR-03 are readable again and both land near zero, which also shows the morning campaigns had been right without being able to prove it.",
]
established = [
    "the analyzer already refuses any capture whose presentation viewport is not 1920x1080 physical pixels",
    "browser_callback_to_present carries 16715 samples in configuration B and 14183 in configuration C; configuration A has none by construction since it runs without Browser",
]


[[budgets]]
id = "NFR-02"
release = "human"
owner = "US-014"
status = "MEASURED"
subject = "terminal under web load"
evidence = "target/ep004-m1-60hz-v2/m1-comparison.json and target/ep004-m1-120hz-v2/m1-comparison.json"
observed = "terminal_input_to_present overhead of configuration C over configuration A: at 60 Hz p95 6000 ns and p99 61000 ns; at 120 Hz p95 1106000 ns and p99 -32000 ns, against a p95 budget of 1 ms and a p99 budget of 2 ms"
observed_on = "Windows 11 build 26200 UBR 9445, NVIDIA GeForce RTX 4070 Ti SUPER driver 32.0.16.1656, 1920x1080 physical viewport, 59.94 Hz and 120 Hz modes, five repetitions per configuration, application binary sha256 f5ef6cd1c98bbbb8a44a38427cdc19e29897ab5d4d20b9febfd8acff9468f134, captured 2026-09-12"
foreground = "every one of the thirty captures reports window_foreground ratio 1, so no repetition was throttled by Windows for losing the foreground"
verdict = "WITHIN_BUDGET at 60 Hz. At 120 Hz the p95 overhead of 1.106 ms exceeds the 1 ms budget by 0.106 ms while the p99 overhead is negative: recorded, per PRD revision 1.2 US-014, as within the uncertainty of the method, neither a PASS nor a failure, with no threshold changed."
uncertainty = "the 120 Hz excess is below what this method resolves. The deltas are medians of per-repetition percentiles of two separate configurations, not paired samples, and the two configurations measure 42.90 ms and 44.00 ms p95; a p95 delta that exceeds its own p99 delta describes no single distribution. Settling whether the budget is met needs paired per-repetition deltas or more repetitions, not a correction designed on this figure."
caveat = "the campaign reports OBSERVED_NOT_BUDGET_CERTIFIED; the comparison tool states observations and never pronounces a budget verdict"


subject = "web presentation overhead and missed frames"
evidence = "target/ep004-m1-60hz-v2/m1-comparison.json and target/ep004-m1-120hz-v2/m1-comparison.json"
observed = "integrated browser overhead of configuration C over configuration B: at 60 Hz p95 100000 ns and p99 144000 ns; at 120 Hz p95 -122000 ns and p99 -121000 ns, against a 2 ms p95 budget. Present accounting: zero unmatched presents in all thirty captures, and at most one dropped present, in a single 120 Hz configuration A repetition of 7200"
observed_on = "Windows 11 build 26200 UBR 9445, NVIDIA GeForce RTX 4070 Ti SUPER driver 32.0.16.1656, 1920x1080 physical viewport, 59.94 Hz and 120 Hz modes, five repetitions per configuration, application binary sha256 f5ef6cd1c98bbbb8a44a38427cdc19e29897ab5d4d20b9febfd8acff9468f134, captured 2026-09-12"
foreground = "every one of the thirty captures reports window_foreground ratio 1, so no repetition was throttled by Windows for losing the foreground"
verdict = "WITHIN_BUDGET on both modes; at 120 Hz the integrated configuration presents marginally faster than the Browser-alone witness"
uncertainty = "at 120 Hz the minimal CEF witness of configuration B presents about 4332 frames per capture against exactly 7200 for configurations A and C, so the C over B overhead compares two different presentation cadences at that mode. At 59.94 Hz all three configurations present about 3595 frames and the comparison is like for like."
caveat = "the campaign reports OBSERVED_NOT_BUDGET_CERTIFIED; the comparison tool states observations and never pronounces a budget verdict"


name = "two-pane-prefill"
layout = "even_h"

[defaults]
timeout_secs = 30

[[step]]
id = "producer"
pane = { cwd = "/Users/m1/pfq-cli-flow", name = "fproducer" }

[[step]]
id = "reviewer"
pane = { cwd = "/Users/m1/pfq-cli-flow", name = "freviewer" }

[[step]]

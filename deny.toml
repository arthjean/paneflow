# cargo-deny configuration.
#
# Graduated-severity posture (Bevy pattern). The CI `security_audit`
# job is BLOCKING and required via `tests_pass` - false positives are
# absorbed inside this file, not via `continue-on-error` on the job.
#
#   * advisories.vulnerabilities → deny (cargo-deny 0.19 default)
#   * advisories.unmaintained    → workspace-scoped warn
#   * advisories.yanked          → warn
#   * advisories.ignore = [...]  → explicit per-advisory list with
#                                  rationale + re-evaluation triggers
#   * unused-ignored-advisory    → warn (surface stale ignores when
#                                  the dep graph evolves)
#   * licenses.allow             → permissive set + GPL-3 family
#                                  (33+ transitive deps from GPUI)
#   * sources                    → unknown-registry / unknown-git deny
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Treat unmaintained crates as a workspace-scoped warn (not a blanket
# dep-tree warn). "workspace" scope: only direct workspace members'
# own dependencies are flagged, not 10-hop transitive deps that we
# cannot influence without bumping the root dep.
unmaintained = "workspace"
# Yanked crates: warn-only for now. A yanked transitive dep often
# lingers in lockfiles until the parent publishes a bump; blocking
# on yanked would create bandwidth-vs-noise pressure that isn't
# warranted for a release-engineering PRD.
yanked = "warn"
# Fail if the local copy of the RustSec advisory DB is older than 30
# days - guards against a stale CI runner silently missing recent
# advisories. P30D is ISO 8601 duration syntax (30 days).
maximum-db-staleness = "P30D"
# Surface stale `ignore` entries - when a dep tree change drops the
# vulnerable crate, the corresponding ignore becomes inert noise.
# Warn (don't fail) so a routine GPUI bump doesn't suddenly block a
# tag cut; the warning bubbles up to the CI log and gets cleaned in
# the next deny.toml maintenance pass. Mirrors Bevy's pattern.
unused-ignored-advisory = "warn"

# Explicit advisory ignores. Each entry below MUST document:
#   1. why the advisory does not apply to PaneFlow's threat model
#   2. what triggers re-evaluation (upstream patch, code-path change)
# Reviewed 2026-07-03.
ignore = [
    # Empty since 2026-08-26: dropping the Zed fork (and with it the
    # `markdown` / `theme` / `ui` / `collections` crates) removed 278
    # packages from the lockfile, including every crate the previous
    # entries covered:
    #   * RUSTSEC-2023-0071 (`rsa` Marvin attack) arrived via
    #     zed/markdown -> zed/language -> zed/rpc -> rsa. `rsa` is no
    #     longer in Cargo.lock.
    #   * RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml DoS) covered
    #     quick-xml 0.38.4 via Zed's mermaid_render and 0.39.2 via
    #     syntect/plist + Wayland/zbus tooling. The tree now resolves a
    #     single quick-xml 0.41.0, which is past both advisories.
    # cargo-deny warns on ignores that match nothing
    # (`unused-ignored-advisory` above), so stale entries are removed
    # rather than kept "just in case". Re-add with the same two-part
    # rationale (why it does not apply + what triggers re-evaluation)
    # if a GPUI bump reintroduces a vulnerable crate.
    #
    # RUSTSEC-2026-0192: `ttf-parser` is unmaintained. It has been in the
    # tree since the first GPUI pin (fontdb -> ttf-parser, through
    # gpui_platform's font-kit path) and the terminal renderer now reads
    # the bundled fonts' metric tables through it directly rather than
    # adding a second parser (`skrifa`) next to it. The only input it
    # parses is the eight TTFs embedded in the binary, never user or
    # network data, so an unfixed parsing bug cannot be reached with
    # foreign input. Re-evaluate when the GPUI pin moves fontdb off
    # ttf-parser: switch the direct dependency to the same successor and
    # drop this entry.
    "RUSTSEC-2026-0192",
]

[licenses]
# Permissive-license allow list. An unlisted license raises a warning
# per the sources deny posture below. Covers the full Rust ecosystem
# mainstream + the specific ones present in our current Cargo.lock
# (Unicode-3.0 for the Unicode crates, Zlib for miniz_oxide, BSD
# variants for misc parsers, plus extras pulled in by GPUI's image /
# font-kit dep tree: 0BSD, MPL-2.0, CC0-1.0, CDLA-Permissive-2.0,
# bzip2-1.0.6, NCSA - all OSI-approved or public-domain-equivalent).
#
# GPL-3.0 / GPL-3.0-or-later - accepted globally (2026-05-27),
# re-scoped 2026-08-26. `GPL-3.0-or-later` now matches only Paneflow's
# own workspace crates; `GPL-3.0` matches nothing.
#
# Until 2026-08-26 the Zed monorepo contributed 33+ `GPL-3.0` crates
# transitively through the `markdown` / `theme` / `ui` dependencies
# (askpass, clock, component, fs, fuzzy, git, icons, language, lsp,
# menu, migrator, net, paths, proto, release_channel, rope, rpc,
# settings*, syntax_theme, task, telemetry*, text, zed_actions, ...).
# Dropping the Zed fork dropped all of them: every Zed crate left in
# the tree (gpui*, collections, sum_tree, util_macros, http_client,
# media, scheduler, perf, refineable, zlog, ztracing*) is Apache-2.0.
#
# Both entries stay in the allow list anyway. A GPUI bump can pull a
# GPL crate back in through a new `gpui` dependency, and a hard
# licenses failure on a tag cut costs far more than the
# `license-not-encountered` warning cargo-deny emits meanwhile. The
# per-crate `[[licenses.exceptions]]` approach this replaced was
# unsustainable - every pin bump shifted the list out of sync.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "NCSA",
    "GPL-3.0",
    "GPL-3.0-or-later",
]

# Boost Software License 1.0 is required only by xxhash-rust, pulled through
# Zed's fs -> notify 9 path. Scoped to the crate and its 0.8 line so a new
# BSL-1.0 dependency is still rejected, but a patch bump inside 0.8 does not
# turn the license check red on its own.
exceptions = [
    { crate = "xxhash-rust@0.8", allow = ["BSL-1.0"] },
]

[sources]
# Block unknown crate registries or git sources. Require immutable revisions:
# every git source must be a full 40-char sha, enforced a second time by the
# workspace dependency_source_policy test (which also checks the sha matches
# the commit Cargo resolved). Tightened from "tag" to "rev" on 2026-08-26 -
# `merman` was the only tag-spec'd source and it left the tree with the Zed
# fork.
unknown-registry = "deny"
unknown-git      = "deny"
required-git-spec = "rev"
# Pin the crates.io registry explicitly; anything else is "unknown".
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
# Keep repository authorization exact. Organization-wide grants would let a
# transitive update introduce an unrelated repository without review.
# `scap` and `wasm_thread` arrived with the 2026-08-26 GPUI bump. Neither is
# built for Linux, macOS or Windows: `wasm_thread` is reached only through
# `gpui_web`/`scheduler` under a wasm32 target gate, and `scap` is an
# unactivated optional feature. They are locked because Cargo resolves every
# target, and they are listed here so a future bump that starts compiling them
# still lands on a reviewed repository.
allow-git = [
    "https://github.com/proptest-rs/proptest",
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/zed",
]
